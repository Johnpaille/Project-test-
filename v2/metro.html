<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mythic Brawl V2 · Toit du métro</title>
<script src="models/ual1.js"></script>
<script src="engine.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body style="margin:0;background:#0a0820">
<div id="load" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:18px system-ui,sans-serif;color:#fff;background:#0a0820">Chargement des modèles 3D…</div>
<script type="module">
// Level 2, Toit du métro: fights on 4 wagons, automatic run sections in between (jump the couplings, crouch under low bridges, jump the gantries), boss Deadeye.
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import {OutlineEffect} from 'three/addons/effects/OutlineEffect.js';
const {DT,rand,clamp,scene,hemi,sun,toon,toUW,fromUW,LV,noInk,glowM,fieldM,lb,lc,play,flash,CYAN,P,H,robots,spark,bolt,glow,kill,hurtRobot,hurtPlayer,alive,unflash,keep,msg,G,start,aura,say,fade,startCine,spawnGang,metroCar,V3,makeDeadeye,aimLaser,eshot}=await MBEngine({THREE,GLTFLoader,SkeletonUtils,OutlineEffect});

scene.background.set('#0b1030');scene.fog.color.set('#0b1030');scene.fog.near=40;scene.fog.far=95;hemi.color.set('#7a88d8');hemi.groundColor.set('#1a1430');hemi.intensity=1;sun.color.set('#b8c8ff');sun.intensity=1.4;
/* ---------- the train: 10 wagons of 22 m with 2 m couplings. Wagons 1, 4, 7, 10 are arenas; the ones between are run sections ---------- */
const CAR=22,GAP=2,NCAR=10,WD=2.5,SPD=14; // SPD: how fast the city scrolls past
const ZONES=[
  {u0:0,u1:22,name:'WAGON DE QUEUE',hint:'Le train file : reste sur le toit · F : garde, J : combo',wave:[[16,-1.5,'p'],[18,1.5,'p'],[20,0,'v']]},
  {u0:72,u1:94,name:'WAGON 4',hint:'Sous la caténaire (côté fond) : H recharge plus vite, les ennemis projetés dessous grillent',wave:[[16,-1.2,'b'],[18,1.5,'v'],[1.5,0,'p']]},
  {u0:144,u1:166,name:'WAGON 7',hint:'Ils montent par les deux bouts',wave:[[16,-1.5,'p'],[17,1.5,'p'],[19,0,'p'],[1.5,1,'v']]},
  {u0:216,u1:238,name:'MOTRICE · DEADEYE',hint:'Sa visée laser se fige juste avant le tir : écarte-toi ou saute',boss:1}];
for(let k=0;k<NCAR;k++){const c=metroCar(CAR,5.6,3);c.position.set(k*(CAR+GAP)+CAR/2,-3,0);LV.add(c)}
const GAPS=[...Array(NCAR-1)].map((_,k)=>k*(CAR+GAP)+CAR);
const canvasTex=(w,h,draw,rx=1,ry=1)=>{const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.colorSpace=THREE.SRGBColorSpace;return t};
const dark=toon('#22252e'),steel=toon('#6b7486');
// track bed under the train and the street far below: textures scroll to fake the speed
const sleepers=canvasTex(64,64,g=>{g.fillStyle='#2a2830';g.fillRect(0,0,64,64);g.fillStyle='#4a3a2e';g.fillRect(0,0,18,64);g.fillStyle='#8a929c';g.fillRect(0,14,64,4);g.fillRect(0,46,64,4)},120,1);
const street=canvasTex(128,128,g=>{g.fillStyle='#14182a';g.fillRect(0,0,128,128);g.fillStyle='#d8b23a';g.fillRect(10,62,40,4);for(let i=0;i<14;i++){g.fillStyle=Math.random()<.5?'#ffd27a':'#ff3fb0';g.fillRect(Math.random()*128,Math.random()*128,3,3)}},40,4);
lb(500,.3,6,toon('#ffffff',{map:sleepers}),120,-3.35,0);lb(500,.2,60,toon('#ffffff',{map:street}),120,-14,-10);
// city skyline far back (slow scroll = depth) and mid buildings that rush past
const skyT=canvasTex(512,128,g=>{g.fillStyle='#0b1030';g.fillRect(0,0,512,128);for(let x=0;x<512;){const w=rand(18,46),h=rand(30,120);g.fillStyle='#161c3a';g.fillRect(x,128-h,w,h);
  for(let y=128-h+6;y<124;y+=9)for(let xx=x+4;xx<x+w-4;xx+=8)if(Math.random()<.3){g.fillStyle='#ffd27a';g.fillRect(xx,y,3,4);g.fillStyle='#161c3a'}x+=w+2}},3,1);
const sky=new THREE.Mesh(new THREE.PlaneGeometry(260,40),noInk(new THREE.MeshBasicMaterial({map:skyT,fog:false})));sky.position.set(120,6,-60);LV.add(sky);
const facade=(base)=>canvasTex(128,256,g=>{g.fillStyle=base;g.fillRect(0,0,128,256);for(let r=0;r<5;r++)for(let c=0;c<3;c++){g.fillStyle=Math.random()<.35?'#ffd27a':'#141826';g.fillRect(12+c*40,14+r*42,26,28)}},1,2);
const movers=[]; // scenery that scrolls past and wraps around the player: {m, span}
const mover=(m,span)=>{movers.push({m,span});return m};
for(let i=0;i<12;i++){const h=rand(10,22);mover(lb(rand(5,7),h,6,toon('#ffffff',{map:facade(['#3a3550','#4a3a3a','#2a2e36','#5a3326'][i%4])}),i*8,-14+h/2,-15),96)}
// catenary: poles rush past, the wire hangs over the back half of the roof
const WIRE_W=-1.8;lb(500,.06,.06,toon('#9aa4b4'),120,4.3,WIRE_W);
for(let i=0;i<8;i++){const g=new THREE.Group();LV.add(g);g.position.x=i*12;g.add(lb(.3,8.2,.3,dark,0,.7,-3.6),lb(.15,.15,2.2,dark,0,4.5,-2.6));mover(g,96)}
// gates at each arena edge (yellow holo field across the roof)
const gates=[22,72,94,144,166,216].map(u=>{const g=new THREE.Group();g.position.x=u;LV.add(g);const beams=new THREE.Group();
  for(const y of [.5,1.1]){const m=new THREE.Mesh(new THREE.BoxGeometry(.05,.18,5.6),glowM('#ffd23a'));m.position.y=y;beams.add(m)}
  const f=new THREE.Mesh(new THREE.BoxGeometry(.2,1.4,5.6),fieldM('#ffd23a',.12));f.position.y=.8;beams.add(f);g.add(beams);return {u,beams}});

/* ---------- run sections: automatic forward run between arenas; low bridges (crouch: hold H), gantries (jump), couplings (jump) ---------- */
const obst=[],FALL=[-.707,.707]; // FALL: world direction of -u (knockback backwards)
function addObstacle(kind,u){const g=new THREE.Group();g.position.x=u;LV.add(g);const stripes=toon('#e0b020');
  if(kind==='bridge'){g.add(lb(1.6,.9,12,toon('#4a4f5a'),0,2.05,0),lb(1.62,.2,12,stripes,0,1.7,0),lb(1,6,1,dark,0,-1.4,-4.5),lb(1,6,1,dark,0,-1.4,4.5))}
  else{g.add(lb(.35,.35,7,stripes,0,.55,0),lb(.3,4,.3,dark,0,-1.4,-3.4),lb(.3,4,.3,dark,0,-1.4,3.4))}
  obst.push({kind,g,u});msg(kind==='bridge'?'PONT BAS !':'PORTIQUE !',kind==='bridge'?'Accroupis-toi : maintiens H':'Saute : K');G.msgT=70}
let runT=0,nextObs=0;
function updateRun(){if(G.cine||P.hp<=0)return;
  const [u,w]=toUW(P.x,P.z),N=ZONES[G.cleared+1],run=!G.fighting&&G.cleared>=0&&N&&u<N.u0+4;
  runT=run?runT+1:0;
  if(runT===40){msg('COURSE !','Le train file vers le wagon suivant · saute les attelages (K)');G.msgT=110;nextObs=G.T+120}
  if(runT>40){[P.x,P.z]=fromUW(u+6*DT,w); // auto run
    const cu=u+9; // where an obstacle spawned 30 m ahead meets the player (closing speed 20 m/s)
    if(G.T>=nextObs&&cu%(CAR+GAP)>3&&cu%(CAR+GAP)<CAR-3&&cu<N.u0-2){addObstacle(Math.random()<.5?'bridge':'beam',u+30);nextObs=G.T+rand(100,140)}}
  for(let i=obst.length;i--;){const o=obst[i];o.u-=SPD*DT;o.g.position.x=o.u;
    if(!o.done&&o.u<=u){o.done=1;const safe=o.kind==='bridge'?P.state==='power':P.y>.7;
      if(!safe){hurtPlayer(15,...FALL,null);P.kx=FALL[0]*3;P.kz=FALL[1]*3;spark(P.x,o.kind==='bridge'?1.8:.6,P.z,14,'#ffd23a',6,.5)}}
    if(o.u<u-35){LV.remove(o.g);obst.splice(i,1)}}
  // couplings: landing in the gap costs health and puts you on the next wagon
  if(!G.fighting&&P.y<.05){const g=GAPS.find(g=>u>g&&u<g+GAP);if(g!==undefined){hurtPlayer(10,...FALL.map(v=>-v),null);[P.x,P.z]=fromUW(g+GAP+.4,w);spark(P.x,.3,P.z,12,'#ffb040',5,.5)}}
  // catenary: charging under the wire is faster
  if(P.state==='power'&&w<WIRE_W+.8){P.en=Math.min(100,P.en+.5);if(G.T%10===0)bolt(P.x,4.3,P.z,P.x,1.7,P.z,'#bff8ff',.12)}}
function updateScenery(){const pu_=toUW(P.x,P.z)[0];for(const o of movers){o.m.position.x-=SPD*DT;if(o.m.position.x<pu_-o.span/2)o.m.position.x+=o.span}
  sleepers.offset.x+=SPD*DT/(500/120);street.offset.x+=SPD*DT/(500/40);skyT.offset.x+=.6*DT/(260/3)}
// an enemy knocked hard under the wire gets fried
function onKnock(r){const w=toUW(r.x,r.z)[1];if(w>WIRE_W+.7||(r.zapT||0)>G.T)return false;r.zapT=G.T+60;
  bolt(r.x,4.3,r.z,r.x,1.2,r.z,'#bff8ff',.2);bolt(r.x+.3,4.3,r.z,r.x,.4,r.z,'#ffffff',.15);hurtRobot(r,14,0,0,0,'x');if(r.hp>0)r.stun=90;return r.hp<=0}

/* ---------- boss: Deadeye. Keeps his distance; snipe (laser locks then a fast bolt), volley, kick up close; phase 2: 5-bolt fan, faster, reinforcements ---------- */
const BOSS_COL={snipe:'#ff2020',volley:'#ffb020',fan:'#ff6a20',kick:'#ffffff'};
const put=(o,u,w)=>{[o.x,o.z]=fromUW(u,w)},FACE_R=Math.PI*.75,FACE_L=-Math.PI/4;
function spawnBoss(x,z){const de=makeDeadeye(),r={ch:de.ch,tip:de.tip,x,z,face:FACE_L,hp:260,max:260,boss:1,base:'#000000',state:'idle',st:0,cd:70,kx:0,kz:0};
  de.ch.root.position.set(x,0,z);play(de.ch,'Pistol_Idle_Loop');robots.push(r);return r}
const shoot=(r,nx,nz,spd,dmg)=>{play(r.ch,'Pistol_Shoot',{once:true});eshot(r.x,r.z,nx,nz,'#ffe9a0',spd,dmg,.12);spark(r.x+nx,1.4,r.z+nz,4,'#ffe9a0',3,.3)};
function endAtk(r){r.state='idle';r.st=0;r.cd=rand(45,80)*(r.p2?.65:1);unflash(r);aimLaser()}
function bossAI(r){const R=r.ch,S=r.state;if(S==='down')return;
  if(r.kx||r.kz){r.x+=r.kx*DT;r.z+=r.kz*DT;r.kx*=.85;r.kz*=.85;if(Math.abs(r.kx)+Math.abs(r.kz)<.1)r.kx=r.kz=0}
  const dx=P.x-r.x,dz=P.z-r.z,d=Math.hypot(dx,dz)||1,face=()=>r.face=Math.atan2(dx,dz);
  if(!r.p2&&r.hp<r.max/2&&S==='idle'){Object.assign(r,{p2:1,state:'reload',st:0});flash(R,'#ff6a20');msg('DEADEYE SE DÉCHAÎNE !','Tirs en éventail · des renforts montent à bord');G.msgT=150;
    for(const du of [1.5,20.5])spawnGang(...fromUW(ZONES[3].u0+du,0),'p');return}
  if(r.stun>0){r.stun=Math.min(r.stun,30)-1;aimLaser();play(R,'Idle_Loop');if(r.stun===0)endAtk(r);keep(r);return}
  if(!BOSS_COL[S]&&S!=='reload')r.state='idle'; // e.g. 'walk' after a parry
  if(r.state==='idle'){face();r.cd--;if(P.hp<=0){play(R,'Pistol_Idle_Loop');return}
    const k=d<5?-1:d>9?1:0,v=r.p2?3.4:2.8; // keeps 5-9 m away
    if(k){r.x+=dx/d*k*v*DT;r.z+=dz/d*k*v*DT;play(R,'Walk_Loop')}else play(R,'Pistol_Idle_Loop');
    if(r.cd<=0||d<1.8&&r.cd<25){const m=d<2.4?'kick':r.p2&&Math.random()<.4?'fan':Math.random()<.55?'snipe':'volley';Object.assign(r,{state:m,st:0});flash(R,BOSS_COL[m]);
      play(R,m==='kick'?'Punch_Cross':'Pistol_Aim_Neutral',{once:m==='kick'})}}
  else if(S==='snipe'){const W=r.p2?32:46;
    if(r.st<W-10){face();r.ax=dx/d;r.az=dz/d} // the aim locks 10 frames before the shot: that is the moment to dodge
    if(r.st<W)aimLaser((r.st<W-10||r.st%4<2)&&r.tip.getWorldPosition(V3()),V3().set(r.x+r.ax*20,1.3,r.z+r.az*20));
    if(r.st===W){aimLaser();shoot(r,r.ax,r.az,26,14);G.shake=.15}
    if(r.st>=W+24)endAtk(r)}
  else if(S==='volley'){face();if(r.st===16||r.st===26||r.st===36)shoot(r,dx/d,dz/d,14,8);if(r.st>=56)endAtk(r)}
  else if(S==='fan'){if(r.st<22)face();if(r.st===22){const a=r.face;for(let i=-2;i<=2;i++)shoot(r,Math.sin(a+i*.24),Math.cos(a+i*.24),13,9)}if(r.st>=48)endAtk(r)}
  else if(S==='kick'){face();if(r.st===16&&d<2.4)hurtPlayer(12,dx/d,dz/d,r);if(r.st>=36)endAtk(r)}
  else if(S==='reload'){play(R,'Pistol_Reload',{once:true});if(r.st>=70)endAtk(r)}
  keep(r)}
function bossDown(r){r.state='down';r.st=0;aimLaser();play(r.ch,'Crouch_Idle_Loop');r.base='#000000';flash(r.ch,'#000000');G.shake=.5;for(const o of robots)if(o!==r&&alive(o))kill(o);
  Object.assign(P,{state:'idle',y:0,vy:0,kx:0,kz:0});startCine(outro(r))}

/* ---------- cutscenes: landing on the last wagon; Deadeye beaten points to SkyCell (V1 after1) ---------- */
const intro={len:230,camU:6,u(t){
    if(t===1){put(P,4,-.5);P.y=4;P.face=FACE_R;play(H,'Jump_Loop')}
    fade(1-t/40);if(t<=30)P.y=4*(1-t/30);if(t===30){P.y=0;play(H,'Jump_Land',{once:true});G.shake=.3;spark(P.x,.2,P.z,14,'#c8c0b0',5,.5)}if(t===60)play(H,'Idle_Loop');
    if(t===70)say('THUNDERSTRUCK','Deadeye est en tête du train… Wagon par wagon, alors !',CYAN)},
  end(){P.y=0;put(P,3,0);P.face=FACE_R;play(H,'Idle_Loop')}};
function outro(D){return {len:330,u(t){
    if(t===1){P.face=Math.atan2(D.x-P.x,D.z-P.z);D.face=P.face+Math.PI;play(H,'Idle_Loop')}
    this.camU=(toUW(P.x,P.z)[0]+toUW(D.x,D.z)[0])/2;
    if(t===20)say('DEADEYE','Touché… Va donc voir SkyCell, là-haut. Machiavel y garde quelque chose qui a très faim.','#d8d8d8');
    if(t===160)say('THUNDERSTRUCK','Une prison volante ? Allons voir ce que Hazard y cache.',CYAN);
    if(t>=150&&t<230&&t%4===0)aura();
    fade(t>=280?(t-280)/40:0)},
  end(){location.href='index.html'}}} // SkyCell

start({intro,ZONES,WD,gates,spawn:spawnGang,spawnBoss,bossAI,bossDown,BOSS_COL,bossName:'DEADEYE',bossColor:['#d8d8d8','#c0392b'],onKnock,
  update:()=>{updateScenery();updateRun()}});
</script>
</body></html>
