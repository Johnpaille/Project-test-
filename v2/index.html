<div id="load" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:18px system-ui,sans-serif;color:#fff;background:#0a0820">Chargement des modèles 3D…</div>
<script type="module">
// Level 3 of the campaign, SkyCell: Hazard Industries flying prison, boss Indigo. Engine: engine.js.
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import {OutlineEffect} from 'three/addons/effects/OutlineEffect.js';
const {DT,rand,clamp,scene,toon,toUW,fromUW,WD,LV,noInk,glowM,fieldM,lb,lc,ual,HEADY,makeChar,play,flash,CYAN,P,H,robots,fx,spark,bolt,glow,fxMesh,kill,hurtPlayer,alive,unflash,keep,msg,pressed,G,eshot,eproj,start}=await MBEngine({THREE,GLTFLoader,SkeletonUtils,OutlineEffect});

/* ---------- SkyCell: 4 zones along the screen-right axis ---------- */
const ZONES=[
  {u0:0,u1:26,name:'HANGAR',hint:'Gare aux rafales : elles poussent vers le vide (robots compris)',wave:[[14,-3],[18,3],[22,0,'s']]},
  {u0:26,u1:52,name:'BLOC DES CELLULES',hint:'Frappe la console d’alarme pour libérer les détenus',wave:[[14,-4],[18,1,'s'],[10,4]]},
  {u0:52,u1:78,name:'CŒUR DU RÉACTEUR',hint:'Projette les robots dans les lasers',wave:[[14,-4],[18,0,'s'],[12,4],[4,-4,'s']]},
  {u0:78,u1:100,name:'SALLE DE CONFINEMENT',hint:'Indigo imite les héros : sa couleur annonce l’attaque',boss:1}];
function deckTexture(){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle='#5a6274';g.fillRect(0,0,256,256);g.strokeStyle='#454c5c';g.lineWidth=3;for(let i=0;i<=256;i+=64){g.beginPath();g.moveTo(i,0);g.lineTo(i,256);g.moveTo(0,i);g.lineTo(256,i);g.stroke()}
  g.fillStyle='#7b8496';for(let x=8;x<256;x+=64)for(let y=8;y<256;y+=64){g.fillRect(x,y,4,4);g.fillRect(x+48,y+48,4,4)}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(26,3.3);t.colorSpace=THREE.SRGBColorSpace;return t}
const steel=toon('#6b7486'),dark=toon('#2a2f3a'),bars=toon('#aab3c6'),gold=toon('#d4a82a'),white=toon('#d8dce6'),redLamp=new THREE.MeshBasicMaterial({color:'#ff3333'});
const U0=-2,U1=102,UM=(U0+U1)/2;
lb(U1-U0,1,13.5,toon('#ffffff',{map:deckTexture()}),UM,-.5,0); // deck
lb(U1-U0,.12,.5,gold,UM,.06,6.3); // hazard edge over the void
for(let u=U0;u<=U1;u+=3)lb(.15,1.1,.15,steel,u,.55,6.7);lb(U1-U0,.15,.15,steel,UM,1.1,6.7); // front railing
lb(1,7,14,steel,U0-.5,3.5,0);lb(1,7,14,steel,U1+.5,3.5,0); // end walls
const backWall=(a,b,h=7)=>lb(b-a,h,1,steel,(a+b)/2,h/2,-7.5);
// laser gates between zones: on while the zone ahead is locked
const gates=ZONES.slice(1).map(Z=>{const g=new THREE.Group();g.position.x=Z.u0;LV.add(g);
  lb(.6,3.4,.6,dark,Z.u0,1.7,-6.6);lb(.6,1.6,.6,dark,Z.u0,.8,6.4);
  const beams=new THREE.Group();const at=(m,y)=>(m.position.y=y,beams.add(m));for(const y of [.4,.9,1.4])at(new THREE.Mesh(new THREE.BoxGeometry(.06,.06,13),glowM('#ff3048')),y);
  at(new THREE.Mesh(new THREE.BoxGeometry(.3,1.6,13),fieldM('#ff3048',.18)),.9);g.add(beams);return {u:Z.u0,beams}});
// zone 1, hangar: open bay with a parked dropship, landing pad, crates
backWall(0,26);lb(15,5.2,.3,dark,13,2.6,-6.95);lb(15.6,.4,.4,gold,13,5.3,-6.8);for(const u of [5.6,20.4])lb(.4,5.2,.4,gold,u,2.6,-6.8);
lb(6,1.6,2.6,white,13,1.4,-5.4);lb(1.6,1.1,2,toon('#3a4a78'),16.6,1.7,-5.4);lb(3,.25,5,steel,12.4,1.3,-5.4);lb(1.2,1.4,.25,steel,9.9,2.4,-5.4); // dropship
lc(3,.04,dark,8,.02,1);const padRing=new THREE.Mesh(new THREE.TorusGeometry(2.7,.12,6,40),gold);padRing.rotation.x=Math.PI/2;padRing.position.set(8,.05,1);LV.add(padRing);
for(const [x,z,w,h] of [[7.3,1,.3,1.8],[8.7,1,.3,1.8],[8,1,1.1,.3]])lb(w,.03,h,white,x,.06,z); // "H"
const crate=toon('#c86a2a');for(const [u,w,n] of [[2.5,-4.6,2],[3.8,-4.4,1],[22,-4.8,2],[23.4,-3.9,1]])for(let k=0;k<n;k++)lb(1.2,1.2,1.2,crate,u,.6+k*1.2,w);
for(let u=1;u<26;u+=2)lb(.9,.02,.3,(u/2|0)%2?gold:dark,u,.02,5.6); // edge warning stripes
// zone 2, cell block: force-field cells and alarm lamps
backWall(26,52);const fields=[],lamps=[];
for(let i=0;i<4;i++){const u=29.5+i*6.2;lb(5,4.2,.3,dark,u,2.1,-6.95);for(let k=0;k<2;k++)lb(.25,4.4,.4,steel,u-2.6+k*5.2,2.2,-6.8);
  fields.push(lb(4.8,4,.05,fieldM('#ff5070',.28),u,2.1,-6.6));lamps.push(lb(.5,.3,.3,redLamp,u+2.2,5,-6.9))}
lb(26,.03,.25,toon('#b02838'),39,.02,-5.8);lb(1,1.2,.6,dark,39,.6,-5.4);const alarmBtn=lb(.5,.12,.4,glowM('#ff3040'),39,1.26,-5.4);
// zone 3, reactor core: glowing column of divine sparks, vats, pipes
backWall(52,78,8);const core=lc(.8,8,glowM('#ffd36a'),65,4,-6.2,{noShadow:1});lc(1.3,8.2,fieldM('#9ab0ff',.18),65,4.1,-6.2,{noShadow:1,open:1});
for(const y of [.6,3.6,6.6]){const r=new THREE.Mesh(new THREE.TorusGeometry(1.45,.16,8,32),gold);r.rotation.x=Math.PI/2;r.position.set(65,y,-6.2);LV.add(r)}
const vats=[];for(const u of [55,58.5,71.5,75]){lc(.7,.3,dark,u,.15,-5.6);vats.push(lc(.55,1.6,glowM('#ffc94a'),u,1.1,-5.6,{noShadow:1}));lc(.7,.25,dark,u,2,-5.6);for(const a of [0,2.1,4.2])lb(.1,1.7,.1,steel,u+Math.cos(a)*.62,1.1,-5.6+Math.sin(a)*.62)}
for(const y of [5,5.8])lb(26,.5,.5,toon('#56607a'),65,y,-6.8);
// zone 4, containment room: Olympian-metal pod, wide window on the sky, indigo pylons
backWall(78,83.5);backWall(94.5,100);lb(11,1.3,1,steel,89,.65,-7.5);lb(11,1.5,1,steel,89,6.25,-7.5);const win=lb(11,4.2,.2,toon('#121a44'),89,3.4,-6.9);lb(11.6,.3,.4,gold,89,5.6,-6.8);lb(11.6,.3,.4,gold,89,1.2,-6.8);
lc(2,.4,steel,89,.2,-3.2);const podRing=new THREE.Mesh(new THREE.TorusGeometry(1.7,.14,8,40),gold);podRing.position.set(89,2,-3.2);LV.add(podRing);
const podRing2=new THREE.Mesh(new THREE.TorusGeometry(1.55,.1,8,40),gold);podRing2.position.set(89,2,-3.2);podRing2.rotation.x=Math.PI/2;LV.add(podRing2);const pod=new THREE.Mesh(new THREE.SphereGeometry(1.3,24,16),fieldM('#8a7cff',.2));pod.position.set(89,2,-3.2);LV.add(pod);
const pylons=[];for(const [u,w] of [[84,-5.5],[94,-5.5],[83,3.5],[95,3.5]]){lb(.6,.3,.6,dark,u,.15,w);pylons.push(lc(.18,2.6,glowM('#6a5cff'),u,1.6,w,{noShadow:1}))}
function animDecor(t){for(const l of lamps)l.visible=(t/500|0)%2===0;fields.forEach((f,i)=>f.material.opacity=.22+.08*Math.sin(t/90+i));
  core.scale.setScalar(1+.05*Math.sin(t/200));vats.forEach((v,i)=>v.material.color.setHSL(.12,1,.55+.1*Math.sin(t/300+i)));pod.rotation.y=t/2000;podRing.rotation.y=t/1500;
  pylons.forEach((p,i)=>p.visible=((t/120|0)+i)%7!==0)}
// clouds drifting below the flying prison
const cloudMat=toon('#cfd8ff'),clouds=[];
for(let i=0;i<70;i++){const c=new THREE.Mesh(new THREE.SphereGeometry(rand(3,7),12,8),cloudMat);c.scale.y=.4;c.position.set(rand(-110,110),rand(-18,-8),rand(-110,110));
  noInk(c);scene.add(c);clouds.push(c)}


// g guard (melee), s gunner, p freed prisoner (permanent ally). Generic action names map to UAL clips.
const ROBO={g:{suit:'#5a6274',joint:'#ff3040',hp:40},s:{suit:'#3e4656',joint:'#ffb020',hp:30,gun:1},p:{suit:'#ff8a2a',joint:'#2a2a2a',hp:60,pris:1}};
const RA={Walking:'Jog_Fwd_Loop',Idle:'Idle_Loop',Punch:'Punch_Cross',Death:'Death01',Dance:'Dance_Loop',Hit:'Hit_Chest'},GUN={Walking:'Walk_Loop',Idle:'Pistol_Idle_Loop',Punch:'Pistol_Shoot'};
function visor(ch,col){ch.root.updateMatrixWorld(true);const k=ch.root.scale.x,head=ch.bone('DEF-head'),m=new THREE.Mesh(new THREE.BoxGeometry(.2*k,.05*k,.06*k),glowM(col));
  m.position.copy(head.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0,.09*k,.1*k)));scene.add(m);head.attach(m)}
function spawnRobot(x,z,kind='g'){const K=ROBO[kind],R=makeChar(ual,1.85/HEADY,n=>n==='M_Joints'?K.joint:K.suit);
  for(const [a,c] of Object.entries({...RA,...(K.gun?GUN:{})}))R.acts[a]=R.acts[c];if(!K.pris)visor(R,K.joint);
  const r={ch:R,x,z,face:0,hp:K.hp,state:'walk',st:0,cd:rand(40,90),kx:0,kz:0,gun:K.gun,pris:K.pris,ally:K.pris?Infinity:0};R.root.position.set(x,0,z);play(R,'Walking');robots.push(r);return r}

/* ---------- SkyCell gadgets ---------- */
let freed=0,winBroken=0; // prisoners released, window broken
const WX=Math.SQRT1_2,WZ=Math.SQRT1_2,WIN=fromUW(89,-6.9); // +w (toward the open edge) in world space; window centre
function streak(x,y,z,vx,vz){fxMesh(new THREE.BoxGeometry(.03,.03,.9),'#ffffff',[x,y,z],.35,new THREE.Vector3(vx,0,vz),.6).rotation.y=Math.atan2(vx,vz)}
function ring(x,z,col,life=.9){fxMesh(new THREE.RingGeometry(1.1,1.4,32),col,[x,.06,z],life).rotation.x=-Math.PI/2}
function laserKill(r){kill(r);spark(r.x,1.2,r.z,24,'#ff3048',7,.5);bolt(r.x,2.5,r.z,r.x,0,r.z,'#ff6070',.25);glow.position.set(r.x,1.5,r.z);glow.intensity=25;G.shake=.25}
function blowOff(r,dx,dz,vy){kill(r);r.blow=[dx,dz,vy];spark(r.x,1,r.z,6,'#ffffff')}
function freePrisoners(){freed=1;for(const f of fields)f.visible=false;alarmBtn.material.color.set('#40ff70');
  for(const u of [35.7,41.9])spawnRobot(...fromUW(u,-5.6),'p');msg('DÉTENUS LIBÉRÉS','Ils se battent à tes côtés');G.msgT=100;G.shake=.2}
function updateHazards(){const pu=toUW(P.x,P.z)[0];
  if(G.zone===1&&G.fighting&&!freed&&pressed('attack')){const [cx,cz]=fromUW(39,-5.4);if(Math.hypot(P.x-cx,P.z-cz)<2)freePrisoners()}
  if(G.zone===0&&G.fighting&&G.T%360<120){ // hangar gust: 2 s every 6 s toward the edge; a robot pushed to the edge goes over
    P.x+=WX*2*DT;P.z+=WZ*2*DT;
    for(const r of robots)if(alive(r)&&r.state!=='grabbed'){r.x+=WX*1.4*DT;r.z+=WZ*1.4*DT;if(toUW(r.x,r.z)[1]>WD-.2)blowOff(r,WX,WZ,0)}
    const [x,z]=fromUW(pu+rand(-12,12),rand(-7,4));streak(x,rand(.2,3),z,WX*16,WZ*16)}
  if(winBroken){ // broken window: light bodies are pulled in; robots go out, the player gets cut by the glass
    for(const o of [P,...robots.filter(r=>alive(r)&&!r.boss&&r.state!=='grabbed')]){const dx=WIN[0]-o.x,dz=WIN[1]-o.z,d=Math.hypot(dx,dz)||1,f=(o===P?1.5:3.4)*clamp(6/d,.3,2);
      o.x+=dx/d*f*DT;o.z+=dz/d*f*DT;const [u,w]=toUW(o.x,o.z);
      if(w<-WD+.25&&Math.abs(u-89)<5.5){if(o===P){if(G.T%30===0)hurtPlayer(5,WX,WZ,null)}else blowOff(o,-WX,-WZ,9)}}
    const [x,z]=fromUW(89+rand(-8,8),rand(-2,5)),dx=WIN[0]-x,dz=WIN[1]-z,d=Math.hypot(dx,dz);streak(x,rand(.5,3.5),z,dx/d*14,dz/d*14)}}

/* ---------- boss: Indigo, mist creature that copies the heroes' powers; telegraph colour = hero copied ---------- */
const BOSS_COL={bolt:CYAN,fire:'#ff8a2a',dash:'#a070ff',punch:'#ffffff'},mistMat=noInk(new THREE.MeshBasicMaterial({color:'#7a6cff',transparent:true,opacity:.5,depthWrite:false}));
function spawnBoss(x,z){const R=makeChar(ual,2.6/HEADY,n=>n==='M_Joints'?'#b0a4ff':'#2c2878');for(const m of R.mats){m.transparent=true;m.opacity=.85}
  const r={ch:R,x,z,face:-Math.PI*.75,hp:260,max:260,boss:1,base:'#2a1a7a',state:'idle',st:0,cd:90,kx:0,kz:0};R.root.position.set(x,0,z);play(R,'Idle_Loop');robots.push(r);unflash(r);return r}
function mist(r){const m=new THREE.Mesh(new THREE.SphereGeometry(rand(.08,.2),6,4),mistMat);m.position.set(r.x+rand(-.5,.5),rand(.3,3),r.z+rand(-.5,.5));
  m.userData={v:new THREE.Vector3(rand(-.3,.3),rand(.5,1.2),rand(-.3,.3)),ng:1,life:.9,max:.9};scene.add(m);fx.push(m)}
function phase2(r){r.p2=1;winBroken=1;win.visible=false;spark(WIN[0],3,WIN[1],30,'#cfe0ff',8,.8);G.shake=.5;msg('LA VITRE CÈDE !','Le vide aspire tout ce qui est léger');G.msgT=120;
  for(const w of [-3,3])spawnRobot(...fromUW(clamp(toUW(r.x,r.z)[0],80,98),w))}
function sealBoss(r){r.state='sealed';r.st=0;r.s0=r.ch.root.scale.x;G.over=true;winBroken=0;flash(r.ch,'#ffd36a');msg('');G.shake=.4;
  for(const o of robots)if(o!==r&&alive(o))kill(o);for(const p of eproj)scene.remove(p.m);eproj.length=0}
function endAtk(r){r.state='idle';r.st=0;r.cd=rand(55,95);unflash(r)}
function bossAI(r){const R=r.ch,S=r.state;
  if(S==='sealed'){const [u,w]=toUW(r.x,r.z),k=Math.min(1,r.st/120);[r.x,r.z]=fromUW(u+(89-u)*.05,w+(-3.2-w)*.05);R.root.scale.setScalar(r.s0*(1-k*.85));R.root.position.y=k*1.4;
    if(r.st===120){R.root.visible=false;pod.material.opacity=.6;pod.material.color.set('#c8b8ff');spark(...fromUW(89,-3.2).flatMap((v,i)=>i?[2,v]:[v]),30,'#ffd36a',5,.8);G.shake=.3;
      msg('INDIGO CONFINÉ','Enfermé dans le métal olympien · SkyCell est sécurisé · Entrée pour rejouer')}return}
  if(r.kx||r.kz){r.x+=r.kx*DT;r.z+=r.kz*DT;r.kx*=.85;r.kz*=.85;if(Math.abs(r.kx)+Math.abs(r.kz)<.1)r.kx=r.kz=0}
  if(r.st%4===0)mist(r);if(!r.p2&&r.hp<r.max/2)phase2(r);
  const dx=P.x-r.x,dz=P.z-r.z,d=Math.hypot(dx,dz)||1;
  if(r.stun>0){r.stun=Math.min(r.stun,30)-1;play(R,'Idle_Loop');if(r.stun===0)endAtk(r);keep(r);return}
  if(!BOSS_COL[S]&&S!=='idle')r.state='idle'; // e.g. 'walk' after a parry
  if(r.state==='idle'){r.face=Math.atan2(dx,dz);r.cd-=r.p2?1.6:1;
    if(P.hp<=0){play(R,'Dance_Loop');return}
    if(d>3.5){r.x+=dx/d*2.2*DT;r.z+=dz/d*2.2*DT;play(R,'Walk_Loop')}else play(R,'Idle_Loop');
    if(r.cd<=0){const m=d<2.4&&Math.random()<.6?'punch':['bolt','fire','dash'][Math.random()*3|0];Object.assign(r,{state:m,st:0,hit:0});flash(R,BOSS_COL[m]);
      if(m==='bolt'){r.marks=[[P.x,P.z]];if(r.p2)for(let i=0;i<2;i++)r.marks.push([P.x+rand(-3,3),P.z+rand(-3,3)]);for(const [x,z] of r.marks)ring(x,z,CYAN,.85)}
      play(R,m==='punch'?'Punch_Cross':m==='dash'?'Sword_Idle':'Spell_Simple_Enter',{once:m==='punch'})}}
  else if(S==='bolt'){ // Thunderstruck: lightning on the marked spots
    if(r.st===40)play(R,'Spell_Simple_Shoot',{once:true});
    if(r.st===50){G.shake=.3;for(const [x,z] of r.marks){bolt(x+rand(-1,1),14,z,x,0,z,'#fff7b0',.3);bolt(x,14,z,x,0,z,CYAN,.3);spark(x,.3,z,10,CYAN);
      const e=Math.hypot(P.x-x,P.z-z);if(e<1.5&&P.y<1.5)hurtPlayer(14,(P.x-x)/(e||1),(P.z-z)/(e||1),null)}}
    if(r.st>=70)endAtk(r)}
  else if(S==='fire'){ // Hawkees: fireball (three in phase 2)
    if(r.st<22)r.face=Math.atan2(dx,dz);
    if(r.st===22){play(R,'Spell_Simple_Shoot',{once:true});for(const a of r.p2?[-.3,0,.3]:[0]){const c=Math.cos(a),s=Math.sin(a);eshot(r.x,r.z,(dx*c-dz*s)/d,(dx*s+dz*c)/d,'#ff8a2a',9,12,.35)}}
    if(r.st>=50)endAtk(r)}
  else if(S==='dash'){ // Phantom: violet sabre rush along the line shown
    if(r.st===5){r.dx=dx/d;r.dz=dz/d;r.face=Math.atan2(dx,dz);fxMesh(new THREE.BoxGeometry(.18,.02,9),'#a070ff',[r.x+r.dx*4.5,.06,r.z+r.dz*4.5],.45,null,.7).rotation.y=r.face}
    if(r.st===30)play(R,'Sprint_Loop');
    if(r.st>=30&&r.st<48){r.x+=r.dx*15*DT;r.z+=r.dz*15*DT;spark(r.x,1.2,r.z,1,'#a070ff',2,.3);if(!r.hit&&Math.hypot(P.x-r.x,P.z-r.z)<1.3){r.hit=1;hurtPlayer(16,r.dx,r.dz,r)}}
    if(r.st===48)play(R,'Sword_Attack',{once:true});
    if(r.st>=70)endAtk(r)}
  else if(S==='punch'){r.face=Math.atan2(dx,dz);if(r.st===18&&d<2.4)hurtPlayer(10,dx/d,dz/d,r);if(r.st>=40)endAtk(r)}
  keep(r)}

start({ZONES,gates,spawn:spawnRobot,spawnBoss,bossAI,bossDown:sealBoss,BOSS_COL,bossName:'INDIGO',bossColor:['#a99cff','#7a6cff'],
  onKnock:r=>{if(r.pris)return false;const u=toUW(r.x,r.z)[0];if(gates.some(g=>g.beams.visible&&Math.abs(u-g.u)<1)){laserKill(r);return true}}, // thrown into a live laser
  update:t=>{updateHazards();animDecor(t);for(const c of clouds){c.position.x-=DT*1.5;if(c.position.x<-110)c.position.x=110}}});
</script>
</body></html>
