    R.root.position.y=r.st<24?Math.sin(r.st/24*Math.PI)*1.6:0;
    if(r.st===24){play(R,'Jump_Land',{once:true});G.shake=.5;fxMesh(new THREE.RingGeometry(2.9,3.3,48),'#ffb020',[r.x,.06,r.z],.4,null,.85).rotation.x=-Math.PI/2;spark(r.x,.3,r.z,16,'#c8c0b0',6,.5);
      if(d<3.3&&P.y<.4)hurtPlayer(12,dx/d,dz/d,null)}
    if(r.st>=50)endAtk(r)}
  keep(r)}

/* ---------- intro cutscene (from V1 start0): a meteor shower wakes the powers; days later The Beast's gang claims the street ---------- */
const lerp=(a,b,k)=>a+(b-a)*Math.min(1,Math.max(0,k)),put=(o,u,w)=>{[o.x,o.z]=fromUW(u,w)},FACE_R=Math.PI*.75,FACE_L=-Math.PI/4;
const METEORS=[[30,14,-3],[55,2,3.5],[75,19,1],[95,9,-4.2],[110,23,-2],[130,12,3]].map(([t,u,w])=>({t,u,w})).concat([{t:160,u:7.3,w:.6,hero:1}]);
const crater=(x,z,r)=>{const m=new THREE.Mesh(new THREE.CircleGeometry(r,20),noInk(new THREE.MeshBasicMaterial({color:'#16181f'})));m.rotation.x=-Math.PI/2;m.position.set(x,.025,z);scene.add(m)};
let cast=[];
const intro={len:760,camU:8,
  u(t){
    if(t===1){put(P,6,0);P.face=FACE_R;play(H,'Idle_Loop')}
    fade(t<40?1-t/40:t>=300&&t<340?(t-300)/40:t>=340&&t<400?1-(t-370)/30:t>=730?(t-730)/30:0);
    // part 1: meteors, then the one that falls next to the hero
    for(const m of METEORS){const k=(t-m.t+40)/40;if(k<0||k>1&&m.done)continue;
      const [x1,z1]=fromUW(m.u,m.w),[x0,z0]=fromUW(m.u-9,m.w-5),col=m.hero?CYAN:'#ffb040';
      if(!m.mesh){m.mesh=new THREE.Mesh(new THREE.SphereGeometry(m.hero?.4:.3,10,8),glowM(m.hero?'#bff8ff':'#ffd27a'));scene.add(m.mesh)}
      if(k<1){m.mesh.position.set(x0+(x1-x0)*k,24*(1-k)+.3,z0+(z1-z0)*k);spark(m.mesh.position.x,m.mesh.position.y,m.mesh.position.z,2,col,1,.35)}
      else{m.done=1;scene.remove(m.mesh);spark(x1,.5,z1,m.hero?40:24,col,7,.6);crater(x1,z1,m.hero?.9:1.2);glow.position.set(x1,1.5,z1);glow.intensity=m.hero?60:30;G.shake=m.hero?.6:.35}}
    if(t===20)say('','Une nuit, une pluie de météorites s’abattit sur Steel City…');
    if(t===160)play(H,'Hit_Chest',{once:true});if(t===180)play(H,'Crouch_Idle_Loop');
    if(t>=180&&t<300&&t%3===0)aura();
    if(t===210)say('','… et éveilla d’étranges pouvoirs chez certains.');
    if(t===250){play(H,'Spell_Simple_Enter',{once:true});G.shake=.2}if(t===285)play(H,'Idle_Loop');
    // part 2: days later
    if(t===340){say();msg('Quelques jours plus tard…')}
    if(t===375){msg('');this.camU=10;put(P,5,0);P.face=FACE_R;play(H,'Idle_Loop');
      cast=[[spawnBoss(...fromUW(19,0)),19,0],[spawnGang(...fromUW(18,-2.4),'v'),17.5,-2.4],[spawnGang(...fromUW(18.5,2.4),'p'),18,2.4]].map(([r,u,w])=>({r,u,w}));
      for(const c of cast){c.r.face=FACE_L;c.walk=c.r.boss?'Walk_Loop':'Walking';c.idle=c.r.boss?'Idle_Loop':'Idle'}}
    if(t>=375&&t<470)for(const c of cast){put(c.r,lerp(c.u,c.u-7,(t-380)/85),c.w);play(c.r.ch,t<465?c.walk:c.idle)}
    if(t===480)say('THE BEAST','Cette ville a de nouveaux maîtres : moi et ma bande. Dégage, le héros.','#ff6a50');
    if(t===580){say('THUNDERSTRUCK','Ta bande ? On n’a pas reçu ces pouvoirs pour rien. Ça va faire des étincelles !',CYAN);play(H,'Punch_Enter',{once:true})}
    if(t>=580&&t<660&&t%4===0)handArc(t%8?'DEF-handL':'DEF-handR');
    if(t===650)play(cast[0].r.ch,'Punch_Cross',{once:true}); // the Beast slams his fist in his palm, then the gang charges
    if(t===690){say();for(const c of cast){c.r.face=FACE_L;play(c.r.ch,c.walk)}}
    if(t>690)for(const c of cast){const [u,w]=toUW(c.r.x,c.r.z);put(c.r,u-.06,w)}},
  end(){for(const c of cast){scene.remove(c.r.ch.root);robots.splice(robots.indexOf(c.r),1)}cast=[];put(P,3,0);P.face=FACE_R;play(H,'Idle_Loop');G.shake=0}};

/* ---------- outro (V1 after0): The Beast flees, Deadeye misses his shot and jumps on a passing metro; the hero follows -> level 2 ---------- */
function outro(B){let hu,D,de,ride=0;const trainU=t=>hu+8+(t-375)/6,arc=(k,h)=>Math.sin(Math.min(1,Math.max(0,k))*Math.PI)*h;
  return {len:530,u(t){
    if(t===1){hu=Math.min(toUW(P.x,P.z)[0],100);put(P,hu,0);P.face=FACE_R;play(H,'Idle_Loop')}
    this.camU=t>150&&t<440?hu+3.5:toUW(P.x,P.z)[0]; this.camY=1.4+clamp((t-280)/40,0,1)*2.8+clamp((t-470)/25,0,1)*1.6; // frame hero and Deadeye together, then tilt up to the viaduct
    if(t===50)play(B.ch,'Crouch_Idle_Loop');if(t===60)say('THE BEAST','Grr… Ce n’est pas fini ! Tu entendras encore parler de moi !','#ff6a50');
    if(t===130){say();B.face=FACE_R;play(B.ch,'Sprint_Loop')}
    if(t>130&&B.ch.root.visible){const [u,w]=toUW(B.x,B.z);put(B,u+.2,w);if(u>111)B.ch.root.visible=false}
    if(t===150){de=makeDeadeye();D={ch:de.ch,hp:0,state:'cine',st:0,face:FACE_L,x:0,z:0};robots.push(D);put(D,hu+9.5,-3);play(D.ch,'Walk_Loop')}
    if(t>150&&t<190){const [u,w]=toUW(D.x,D.z);put(D,u-.08,w)}
    if(t===190)play(D.ch,'Pistol_Aim_Neutral');
    if(t>=195&&t<238)aimLaser((t<228||t%4<2)&&de.tip.getWorldPosition(V3()),V3().set(P.x,1.3,P.z));
    if(t===228)play(H,'Jump_Loop');if(t>=228&&t<=262)P.y=arc((t-228)/34,1.8);if(t===262)play(H,'Idle_Loop');
    if(t===238){aimLaser();play(D.ch,'Pistol_Shoot',{once:true});const a=de.tip.getWorldPosition(V3()),d=V3().set(P.x,1.3,P.z).sub(a).normalize();
      fxMesh(new THREE.BoxGeometry(.05,.05,.6),'#ffe9a0',[a.x,a.y,a.z],.6,d.multiplyScalar(30)).lookAt(a.clone().add(d));G.shake=.2}
    if(t===270)say('DEADEYE','Tch… De bons réflexes. Rattrape-moi si tu peux !','#d8d8d8');
    if(t>=230)train.position.x=trainU(t);
    if(t===330){say();D.face=Math.atan2(...fromUW(1,-1).map((v,i)=>v-fromUW(0,0)[i]));play(D.ch,'Sprint_Loop')}
    if(t>330&&t<350){const [u,w]=toUW(D.x,D.z);put(D,u,w-.07)}
    if(t===350){play(D.ch,'Jump_Loop');D.u0=toUW(D.x,D.z)}
    if(t>=350&&t<375){const k=(t-350)/25;put(D,D.u0[0]+(trainU(375)-D.u0[0])*k,D.u0[1]+(-6.4-D.u0[1])*k);D.ch.root.position.y=5.8*k+arc(k,1.5)}
    if(t>=375){put(D,trainU(t),-6.4);D.face=FACE_R;D.ch.root.position.y=5.8;if(t===375)play(D.ch,'Pistol_Idle_Loop')}
    if(t===390)say('THUNDERSTRUCK','Woah, raté ! Hé, reviens ici !',CYAN);
    if(t===440){say();P.face=FACE_R;play(H,'Sprint_Loop')}
    if(t>440&&t<470){const [u,w]=toUW(P.x,P.z),tu=trainU(470)-9.3;put(P,u+(tu-u)*.08,w+(-4.5-w)*.08)}
    if(t===470){play(H,'Jump_Loop');ride=toUW(P.x,P.z)}
    if(t>=470&&t<495){const k=(t-470)/25;put(P,ride[0]+(trainU(495)-9.3-ride[0])*k,ride[1]+(-6.4-ride[1])*k);P.y=5.8*k+arc(k,1.5)}
    if(t>=495){put(P,trainU(t)-9.3,-6.4);P.y=5.8;if(t===495)play(H,'Idle_Loop')}
    fade(t>=500?(t-500)/30:0)},
  end(){location.href='metro.html'}}}

start({intro,ZONES,gates,spawn:spawnGang,spawnBoss,bossAI,bossDown,BOSS_COL,bossName:'THE BEAST',bossColor:['#ff6a50','#e0301a'],
  bossDmg:r=>r.state==='stunned'?1.5:.6,onLightning:r=>zapPuddles(r.x,r.z),onStrike:hitProps,update:t=>{updateHazards();animDecor(t)}});
</script>
