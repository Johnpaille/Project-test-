const SKIN='#e0ac7e',V3=()=>new THREE.Vector3(),pick=a=>a[Math.random()*a.length|0];
function dress(R,L){const m=R.root;m.updateMatrixWorld(true);const meshes=[];m.traverse(o=>{if(o.isSkinnedMesh)meshes.push(o)});
  const hipsY=m.getObjectByName('DEF-hips').getWorldPosition(V3()).y,H0=m.getObjectByName('DEF-head').getWorldPosition(V3()).y/1.6*1.8,c=new THREE.Color(),v=V3(),head=new THREE.Box3();R.mats.length=0;

// bulk build: push bind-pose vertices away from their bone axis (inverse of Phantom's slim); call after dress (geometry already cloned)

function bulk(R,f){R.root.traverse(mesh=>{if(!mesh.isSkinnedMesh)return;const geo=mesh.geometry,si=geo.attributes.skinIndex,sw=geo.attributes.skinWeight,bones=mesh.skeleton.bones,inv=mesh.matrixWorld.clone().invert(),pos=geo.attributes.position,v=V3(),d=V3(),q=V3();

  for(let i=0;i<pos.count;i++){let b=0,w=-1;for(let k=0;k<4;k++){const ww=sw.getComponent(i,k);if(ww>w){w=ww;b=si.getComponent(i,k)}}const A=ax[b];if(A.k===1)continue;
    v.fromBufferAttribute(pos,i);const L2=A.d.lengthSq(),t=L2?Math.min(1,Math.max(0,d.subVectors(v,A.a).dot(A.d)/L2)):0;q.copy(A.a).addScaledVector(A.d,t);v.sub(q).multiplyScalar(A.k).add(q);pos.setXYZ(i,v.x,v.y,v.z)}
  geo.computeVertexNormals()})}

function hitProps(reach,fx_,fz){for(let i=props.length;i--;){const p=props[i];if(p.moving)continue;const dx=p.x-P.x,dz=p.z-P.z,d=Math.hypot(dx,dz);if(d>reach+.3||(d>.6&&(dx*fx_+dz*fz)/d<.45))continue;

  if(Math.random()<.6){const m=new THREE.Mesh(new THREE.BoxGeometry(.4,.4,.4),glowM('#5ad15a'));m.position.set(p.x,.4,p.z);scene.add(m);pickups.push(m)}}}

function updateHazards(){
  for(let i=props.length;i--;){const p=props[i];if(!p.moving)continue;p.t++;p.x+=p.vx*DT;p.z+=p.vz*DT;p.g.position.set(p.x,0,p.z);p.g.rotation.y+=.3;

    if(Math.hypot(P.x-m.position.x,P.z-m.position.z)<.9){P.hp=Math.min(100,P.hp+20);spark(m.position.x,.8,m.position.z,10,'#5ad15a');scene.remove(m);pickups.splice(i,1)}}
  for(const p of puddles)if(p.el>0){p.el--;p.m.material.color.set(p.el?(p.el%6<3?'#bff8ff':CYAN):'#34467a'); // electrified: zaps and stuns whoever stands in it (not Thunderstruck)

    m.userData={v:new THREE.Vector3(rand(-.2,.2),rand(1,1.6),rand(-.2,.2)),ng:1,life:1.6,max:1.6};scene.add(m);fx.push(m)}}

function spawnBoss(x,z){const R=makeChar(ual,2.6/HEADY,()=>'#ffffff');dress(R,BEAST);bulk(R,1.55);
  const r={ch:R,x,z,face:-Math.PI*.75,hp:320,max:320,boss:1,base:'#000000',state:'idle',st:0,cd:80,kx:0,kz:0};R.root.position.set(x,0,z);play(R,'Idle_Loop');robots.push(r);return r}
function bossDown(r){r.state='down';r.st=0;G.over=true;play(r.ch,'Death01',{once:true});r.base='#000000';flash(r.ch,'#000000');G.shake=.5;for(const o of robots)if(o!==r&&alive(o))kill(o);
  msg('THE BEAST EST K.O.','La rue est libre… pour l’instant · Entrée pour rejouer')}
function endAtk(r){r.state='idle';r.st=0;r.cd=rand(50,90)*(r.p2?.7:1);unflash(r);r.ch.root.position.y=0}
function bossAI(r){const R=r.ch,S=r.state;if(S==='down')return;
  if(r.kx||r.kz){r.x+=r.kx*DT;r.z+=r.kz*DT;r.kx*=.85;r.kz*=.85;if(Math.abs(r.kx)+Math.abs(r.kz)<.1)r.kx=r.kz=0}
  if(!r.p2&&r.hp<r.max/2&&S!=='charge'){Object.assign(r,{p2:1,state:'roar',st:0});R.root.position.y=0;flash(R,'#ff3020');play(R,'Spell_Simple_Enter',{once:true});return}
  const dx=P.x-r.x,dz=P.z-r.z,d=Math.hypot(dx,dz)||1;
  if(r.stun>0&&S!=='roar'){r.stun=Math.min(r.stun,30)-1;play(R,'Idle_Loop');if(r.stun===0)endAtk(r);keep(r);return}
  if(!BOSS_COL[S]&&S!=='roar'&&S!=='stunned')r.state='idle'; // e.g. 'walk' after a parry
  if(r.state==='idle'){r.face=Math.atan2(dx,dz);r.cd--;
    if(P.hp<=0){play(R,'Dance_Loop');return}
    if(d>3){const v=r.p2?3:2.4;r.x+=dx/d*v*DT;r.z+=dz/d*v*DT;play(R,'Walk_Loop')}else play(R,'Idle_Loop');
    if(r.cd<=0){const m=d<2.8?(Math.random()<.65?'punch':'pound'):d<5&&Math.random()<.3?'pound':'charge';Object.assign(r,{state:m,st:0,hit:0,bounce:0});flash(R,BOSS_COL[m]);
      play(R,m==='punch'?'Punch_Cross':m==='charge'?'Crouch_Idle_Loop':'Jump_Start',{once:m!=='charge'})}}
  else if(S==='roar'){ // phase 2: smashes the warehouse front open, the arena grows
    if(r.st===30){facadeG.visible=false;ZONES[3].u1=112;const [x,z]=fromUW(97,0);spark(x,2,z,40,'#9aa0aa',9,.9);G.shake=.6;R.root.scale.multiplyScalar(1.12);r.base='#4a0800';
      msg('THE BEAST S’ENRAGE !','Il défonce l’entrepôt · ses charges rebondissent sur les murs');G.msgT=150}
    if(r.st>=70)endAtk(r)}
  else if(S==='charge'){ // red line = his path; jump over him or step aside
    if(r.st<=5)r.face=Math.atan2(dx,dz);
    if(r.st===5){r.dx=dx/d;r.dz=dz/d;fxMesh(new THREE.BoxGeometry(.3,.02,16),'#ff3020',[r.x+r.dx*8,.06,r.z+r.dz*8],.6,null,.6).rotation.y=r.face}
    if(r.st===36)play(R,'Sprint_Loop');
    if(r.st>=36){const v=r.p2?17:14,x0=r.x+r.dx*v*DT,z0=r.z+r.dz*v*DT;r.x=x0;r.z=z0;keep(r);if(r.st%3===0)spark(r.x,.2,r.z,2,'#c8c0b0',3,.3);
      if(!r.hit&&Math.hypot(P.x-r.x,P.z-r.z)<1.6&&P.y<1.2){r.hit=1;hurtPlayer(18,r.dx,r.dz,r)}
      if(Math.hypot(r.x-x0,r.z-z0)>.01){G.shake=.4;spark(r.x+r.dx*.8,1.5,r.z+r.dz*.8,16,'#ffffff',6,.5); // hit a wall
        if(r.p2&&r.bounce<2){const [u0,w0]=toUW(x0,z0),[u,w]=toUW(r.x,r.z);let du=(r.dx-r.dz)/S2,dw=(r.dx+r.dz)/S2;if(Math.abs(u-u0)>.005)du=-du;if(Math.abs(w-w0)>.005)dw=-dw;
          r.bounce++;r.hit=0;r.dx=(du+dw)/S2;r.dz=(dw-du)/S2;r.face=Math.atan2(r.dx,r.dz)}
        else{r.state='stunned';r.st=0;unflash(r);play(R,'Hit_Head',{once:true})}}
      else if(r.st>130)endAtk(r)}
    return}
  else if(S==='stunned'){if(r.st%12===0){const h=R.bone('DEF-head').getWorldPosition(V3());spark(h.x,h.y+.4,h.z,3,'#ffe14d',1.5,.5)}if(r.st===40)play(R,'Crouch_Idle_Loop');if(r.st>=(r.p2?70:110))endAtk(r)}
  else if(S==='punch'){r.face=Math.atan2(dx,dz);if(r.st===18&&d<3)hurtPlayer(14,dx/d,dz/d,r);if(r.st>=42)endAtk(r)}
  else if(S==='pound'){ // hop and shockwave ring: jump over it
    R.root.position.y=r.st<24?Math.sin(r.st/24*Math.PI)*1.6:0;
    if(r.st===24){play(R,'Jump_Land',{once:true});G.shake=.5;fxMesh(new THREE.RingGeometry(2.9,3.3,48),'#ffb020',[r.x,.06,r.z],.4,null,.85).rotation.x=-Math.PI/2;spark(r.x,.3,r.z,16,'#c8c0b0',6,.5);
      if(d<3.3&&P.y<.4)hurtPlayer(12,dx/d,dz/d,null)}
    if(r.st>=50)endAtk(r)}
  keep(r)}

start({ZONES,gates,spawn:spawnRobot,spawnBoss,bossAI,bossDown,BOSS_COL,bossName:'THE BEAST',bossColor:['#ff6a50','#e0301a'],
  bossDmg:r=>r.state==='stunned'?1.5:.6,onLightning:r=>zapPuddles(r.x,r.z),onStrike:hitProps,update:t=>{updateHazards();animDecor(t)}});
</script>
</body></html>
