function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(type,f0,f1,dur,vol){if(!AC)return;const t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t0+dur);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+dur)}
function noise(dur,freq,vol,ft='lowpass'){if(!AC)return;if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const t0=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type=ft;f.frequency.value=freq;g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);s.connect(f).connect(g).connect(AC.destination);s.start(t0);s.stop(t0+dur)}

/* ---------- FX ---------- */
const parts=[],bolts=[],arcs=[],links=[]; // links: point-to-point lightning (chain attack)
function part(x,z,y,vx,vy,life,col,sz,g){parts.push({x,z,y,vx,vy,life,max:life,col,sz,g})}
function burst(x,z,y,n,cols,sp,g,life){for(let i=0;i<n;i++)part(x,z,y,rand(-sp,sp),rand(-sp*.5,sp*1.2),rand(life*.5,life)|0,pick(cols),pick([1,2,2,3]),g)}
function prune(a){for(let i=a.length;i--;)if(a[i].life<=0)a.splice(i,1)}
function updateFx(){
  for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vy-=q.g;q.vx*=.96;q.life--;if(q.y<0&&q.g>0){q.y=0;q.vy*=-.3;q.vx*=.7}}
  for(const b of bolts)b.life--;for(const b of links)b.life--;for(const a of arcs){a.life--;a.r+=a.grow||0}
  prune(parts);prune(bolts);prune(arcs);prune(links);
}

/* ---------- DRAW HELPERS ---------- */
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function tri(a,b,c,d,e,f){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.lineTo(e,f);ctx.fill()}
function grad(y0,y1,c0,c1){const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,c0);g.addColorStop(1,c1);ctx.fillStyle=g;ctx.fillRect(0,y0,W,y1-y0)}
function txt(s,x,y,size,col,al='left',out='#000'){ctx.font=`bold ${size}px monospace`;ctx.textAlign=al;ctx.textBaseline='top';ctx.lineJoin='round';ctx.lineWidth=size<12?2:size/5;ctx.strokeStyle=out;ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y)}
function bar(x,y,w,h,v,col,bg){R(x-1,y-1,w+2,h+2,'#000');R(x,y,w,h,bg||'#300');R(x,y,Math.max(0,w*v)|0,h,col)}
function layer(f,segW,fn,extra=0){const off=cam*f+extra,i0=Math.floor(off/segW)-1,i1=Math.floor((off+W)/segW)+1;for(let i=i0;i<=i1;i++)fn(i,Math.round(i*segW-off))}
function drawBolt(x0,y0,x1,y1,col,jx=7,jy=0){
  const pts=[[x0,y0]];for(let i=1;i<8;i++)pts.push([x0+(x1-x0)*i/8+rand(-jx,jx),y0+(y1-y0)*i/8+rand(-jy,jy)]);pts.push([x1,y1]);
  for(const [w,c] of [[4,col],[1.5,'#fff']]){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(...pts[0]);for(const p of pts)ctx.lineTo(...p);ctx.stroke()}
}
function drawFx(){
  for(const q of parts){ctx.globalAlpha=Math.min(1,q.life/q.max*2);R(Math.round(q.x-cam-q.sz/2),Math.round(q.z-q.y-q.sz/2),q.sz,q.sz,q.col)}
  for(const a of arcs){ctx.globalAlpha=a.life/a.max;ctx.strokeStyle=a.col;ctx.lineWidth=a.w||2;ctx.beginPath();const c=a.dir>0?0:Math.PI;
    if(a.full)ctx.arc(a.x-cam,a.z-a.y,a.r,0,7);else ctx.arc(a.x-cam,a.z-a.y,a.r,c-1.3,c+1.3);ctx.stroke()}
  ctx.globalAlpha=1;
  for(const b of bolts)drawBolt(b.x-cam,-5,b.x-cam,b.z-18,b.col);
  for(const b of links)drawBolt(b.x0-cam,b.y0,b.x1-cam,b.y1,'#9df',3,5);
}
function shadow(x,z,w){ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(Math.round(x-cam),z,w,2.5,0,0,7);ctx.fill()}

/* Humanoid in local space: facing right, feet at y=0 */
function drawHuman(L,pose,ph,flash){
  const C=c=>flash?'#fff':c;
  const skin=C(L.skin),top=C(L.top),pants=C(L.pants),hair=L.hair?C(L.hair):null,shoe=C(L.shoe||'#1a1a1a'),glove=C(L.glove||L.skin);
  const bob=pose==='idle'&&Math.sin(ph*.08)<0?1:0;
  const lean={hurt:-2,charge:3,windup:-1,punch:1,push:1}[pose]||0;
  // legs
  if(L.robe){R(-7,-15,14,15,top);R(-9,-4,18,4,top);R(-2,-15,2,15,C('#3a2a70'))}
  else if(pose==='kick'){R(-5,-13,4,13,pants);R(-5,-2,5,2,shoe);R(-1,-14,15,4,pants);R(13,-15,3,6,shoe)}
  else if(pose==='jkick'){R(-6,-12,4,7,pants);R(-6,-6,6,2,shoe);R(-1,-13,14,4,pants);R(12,-14,3,6,shoe)}
  else if(pose==='jump'){R(-5,-12,4,9,pants);R(1,-13,4,8,pants);R(-5,-4,5,2,shoe);R(1,-6,5,2,shoe)}
  else{const w=pose==='walk'?Math.round(Math.sin(ph*.3)*3):0,sp=pose==='charge'||pose==='power'?2:0;
    R(-4+w-sp,-13,4,13,pants);R(1-w+sp,-13,4,13,pants);R(-4+w-sp,-2,5,2,shoe);R(1-w+sp,-2,5,2,shoe)}
  const tx=-5+lean,ty=-26+bob,sx=tx+5,sy=ty+2;
  // back arm (behind torso)
  if(pose==='punch'||pose==='push'){R(tx-2,sy+1,5,3,top);R(tx-4,sy,3,4,glove)}
  // torso
  R(tx,ty,10,13,top);
  if(L.accent)R(tx,ty+11,10,2,C(L.accent));
  if(L.emblem){R(tx+5,ty+2,2,3,C(L.accent));R(tx+4,ty+4,2,3,C(L.accent))}
  if(L.skull)for(let i=0;i<3;i++)R(tx+2,ty+3+i*3,6,1,C('#555'));
  // head
  const hx=-4+lean+(pose==='charge'?2:0),hy=-34+bob+(pose==='charge'?3:0);
  R(hx,hy,8,8,skin);
  if(L.skull){R(hx+4,hy+2,3,3,'#111');R(hx+1,hy+2,2,3,'#111');R(hx+3,hy+6,4,1,'#111')}else R(hx+5,hy+3,2,2,'#111');
  if(L.spiky){R(hx-1,hy-2,9,3,hair);R(hx,hy-4,2,2,hair);R(hx+3,hy-5,2,3,hair);R(hx+6,hy-4,2,2,hair);R(hx-2,hy-1,2,4,hair)}
  else if(L.hood){R(hx-1,hy-2,10,3,hair);R(hx-1,hy,3,8,hair);R(hx+2,hy+5,7,3,hair);R(hx+5,hy+3,2,1,C('#f33'))}
  else if(L.mohawk){R(hx+1,hy-4,4,5,hair);R(hx+1,hy-1,6,1,hair)}
  else if(hair){R(hx,hy-1,8,3,hair);R(hx,hy,2,5,hair)}
  if(L.horns){const h=C(L.horns);R(hx-1,hy-3,2,3,h);R(hx-2,hy-5,2,2,h);R(hx+6,hy-3,2,3,h);R(hx+7,hy-5,2,2,h)}
  if(L.beard)R(hx+3,hy+5,5,4,hair);
  if(L.flame)for(let i=0;i<4;i++){const h=2+Math.random()*6|0;R(hx+i*2,hy-h,2,h,C(i%2?L.flame:'#aef'))}
  // front arm
  let fx,fy,ang;
  switch(pose){
    case 'punch':R(sx,sy,13,3,top);R(sx+12,sy-1,4,5,glove);fx=sx+15;fy=sy+1;ang=0;break;
    case 'push':R(sx,sy,12,3,top);R(sx-2,sy+4,12,3,top);R(sx+12,sy-1,3,4,glove);R(sx+10,sy+3,3,4,glove);fx=sx+14;fy=sy+1;ang=0;break;
    case 'windup':R(sx-8,sy,9,3,top);R(sx-11,sy-1,4,5,glove);fx=sx-10;fy=sy+1;ang=Math.PI;break;
    case 'up':R(tx+1,ty-9,3,11,top);R(tx+6,ty-9,3,11,top);R(tx+1,ty-12,3,3,glove);R(tx+6,ty-12,3,3,glove);fx=tx+7;fy=ty-11;ang=-Math.PI/2;break;
    case 'charge':R(sx-7,sy+2,8,3,top);R(sx-9,sy+1,3,4,glove);fx=sx-8;fy=sy+3;ang=Math.PI;break;
    case 'power':R(sx+1,sy,3,9,top);R(sx+2,sy+8,4,4,glove);fx=sx+4;fy=sy+11;ang=.9;break;
    case 'hurt':R(sx-5,sy-5,3,8,top);R(sx-6,sy-8,3,3,glove);fx=sx-5;fy=sy-7;ang=-2.3;break;
    default:R(sx,sy,3,6,top);R(sx+1,sy+5,6,3,top);R(sx+6,sy+4,3,3,glove);fx=sx+8;fy=sy+5;ang=-1;
  }
  if(L.sabres){
    ctx.strokeStyle=C('#e8e8ff');ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(fx+Math.cos(ang)*16,fy+Math.sin(ang)*16);ctx.stroke();
    ctx.beginPath();ctx.moveTo(tx+1,sy+9);ctx.lineTo(tx-9,sy+15);ctx.stroke();
  }
}

/* ---------- HERO SPRITES (Universal LPC sheets, 64px frames, 13 cols) ---------- */
const SPR={};
for(const [id,file] of [['thunder','thunderstruck'],['phantom','phantom'],['hawkees','hawkees'],['necrosis','necrosis'],['aetos','aetos'],['karnak','karnak']]){const im=new Image();im.src='sprites/'+file+'.png';SPR[id]=im}
for(const kind of Object.keys(EK)){const k=EK[kind],f=k.spr||kind;if(k.fly)continue;if(!SPR[f]){SPR[f]=new Image();SPR[f].src='sprites/enemy_'+f+'.png'}SPR[kind]=SPR[f]}
const sprReady=id=>{const s=SPR[id];return!!s&&s.complete!==false&&s.width>0}; // Image or recoloured canvas
// civilians: the thug sheet with its green t-shirt recoloured
SPR.thug.addEventListener('load',()=>{const im=SPR.thug;[[70,120,230],[220,70,70],[230,190,60]].forEach((cc,i)=>{
  const c2=document.createElement('canvas');c2.width=im.width;c2.height=im.height;const x=c2.getContext('2d');x.drawImage(im,0,0);
  const d=x.getImageData(0,0,c2.width,c2.height),a=d.data;
  for(let j=0;j<a.length;j+=4){const g=a[j+1];if(g>a[j]+15&&g>a[j+2]+15){const l=g/170;a[j]=Math.min(255,cc[0]*l);a[j+1]=Math.min(255,cc[1]*l);a[j+2]=Math.min(255,cc[2]*l)}}
  x.putImageData(d,0,0);SPR['civ'+i]=c2})});
// tinted copies of existing sheets: Hyde (green brute), SkyCell robots (steel), Indigo (violet mist)
function tint(src,id,f){const im=SPR[src];im.addEventListener('load',()=>{const c2=document.createElement('canvas');c2.width=im.width;c2.height=im.height;const x=c2.getContext('2d');x.filter=f;x.drawImage(im,0,0);SPR[id]=c2})}
tint('brute','hyde','sepia(1) hue-rotate(50deg) saturate(2.2) brightness(.85)');
tint('golem','robot','grayscale(1) sepia(.5) hue-rotate(170deg) saturate(2.5) brightness(1.2)');
tint('archer','gunner','grayscale(1) sepia(.5) hue-rotate(170deg) saturate(2.5) brightness(1.1)');
tint('hades','indigo','sepia(1) hue-rotate(215deg) saturate(6) brightness(.9)');
const AROW={idle:45,stand:25,walk:11,run:41,thrust:7,slash:15,spell:3,shoot:19,jump:29,hurt:20}; // right-facing rows (hurt has one row)
// ctx origin = feet; 'big' = oversize sabre slash (192px frames under the 64px grid)
function drawSheet(id,a,fr,flash){
  const im=SPR[id];if(flash)ctx.filter=flash==='dark'?'brightness(0) opacity(.7)':'brightness(4)';
  if(a==='big')ctx.drawImage(im,fr*192,3456+3*192,192,192,-96,-125,192,192);
  else if(a==='w128')ctx.drawImage(im,fr*128,3456+3*128,128,128,-64,-93,128,128); // walk_128 (bow carried while walking)
  else ctx.drawImage(im,fr*64,AROW[a]*64,64,64,-32,-61,64,64);
  ctx.filter='none';
}
const heroSpr=p=>{const c=G.char;return p.form>0&&c.spr2?c.spr2:c.spr||c.id};
// enemy sheets (playable bosses) have no combat-idle row: stand row, or walk frame 0 when the stand row lacks the weapon
function idleOf(id){const ek=EK[id==='hyde'?'brute':id];return ek?(ek.sw?['walk',0]:['stand',(t/20|0)%2]):['idle',(t/20|0)%2]}
function heroFrame(f){
  const c=G.char,id=heroSpr(f),big=c.big&&SPR[id].naturalHeight>3456,sw=big?'big':'slash';
  switch(f.state){
    case 'idle':case 'guard':return idleOf(id);
    case 'walk':return ['walk',1+(f.walk/5|0)%8];
    case 'roll':return ['jump',1];
    case 'grab':return ['thrust',f.kn>0?5:2];
    case 'throw':return [sw,Math.min(5,f.st/3|0)];
    case 'atk':{const k=Math.min(.99,f.st/(f.atk.su+f.atk.ac+f.atk.rc));
      if(big)return ['big',k*6|0];
      return f.combo===2?['slash',k*6|0]:['thrust',k*8|0]}
    case 'jump':return f.atk&&f.at<12?[sw,3]:['jump',f.vy>2?1:f.vy>0?2:f.vy>-2?3:4];
    case 'dash':return ['run',(f.walk/4|0)%8];
    case 'datk':return c.mfx==='slash'?[sw,Math.min(5,f.st/3|0)]:['thrust',Math.min(7,3+(f.st/3|0))];
    case 'special':{if(f.sp===0)return ['thrust',Math.min(7,f.st/2|0)]; // Karnak's rocket punch
      const a=SPA[f.sp===1?c.m1:c.m2];
      if(a==='swing')return [sw,(f.st/3|0)%6];
      if(a==='thrust')return ['thrust',Math.min(7,f.st/3|0)];
      if(a==='run')return ['run',(f.st/3|0)%8];
      if(a==='jump')return ['jump',f.y>0?(f.vy>0?1:3):0];
      return ['spell',Math.min(6,f.st/4|0)]}
    case 'power':return ['spell',2+((t>>3)&1)];
    case 'cast':return ['spell',Math.min(6,f.st/3|0)];
    case 'hold':return [sw,big?0:1];
    case 'catk':return big?['big',Math.min(5,f.st/3|0)]:['slash',Math.min(5,1+(f.st/3|0))];
    case 'hurt':return ['hurt',1];
    case 'fall':return ['hurt',Math.min(5,1+(f.st/3|0))];
    case 'getup':return ['hurt',Math.max(0,5-(f.st/3|0))];
    default:return ['hurt',5];
  }
}
// muscular bodies + skeleton have no combat_idle row, so enemies use the plain idle row (25)
function enemyFrame(f){
  switch(f.state){
    case 'idle':if(f.stun>0)return ['hurt',1];return f.k.sw?[f.k.w128?'w128':'walk',0]:['stand',(t/20|0)%2]; // sw: idle row lacks coat/weapon
    case 'walk':return [f.k.w128?'w128':'walk',1+(f.walk/5|0)%8];
    case 'windup':{const a=f.k.anim;return a==='big'?['big',Math.min(1,f.st/9|0)]:a==='slash'?['slash',Math.min(1,f.st/9|0)]:['thrust',Math.min(3,f.st/5|0)]}
    case 'strike':{const a=f.k.anim;return a==='big'?['big',Math.min(5,2+(f.st/3|0))]:a==='slash'?['slash',Math.min(5,2+(f.st/3|0))]:['thrust',Math.min(7,4+(f.st/2|0))]}
    case 'bwind':switch(f.move){
      case 'charge':return ['thrust',1];
      case 'snipe':case 'volley':return ['thrust',f.st<10?f.st/3|0:4]; // crossbow raised and aimed
      case 'arrow':return ['shoot',Math.min(8,f.st/3|0)]; // bow drawn, released at frame 9
      case 'pounce':return ['jump',0];
      case 'flameslash':return ['big',Math.min(1,f.st/13|0)];
      default:return ['spell',Math.min(6,f.st/5|0)]}
    case 'charge':return ['run',(f.st/3|0)%8];
    case 'leap':return ['jump',f.vy>1.5?1:f.vy>-1.5?2:3];
    case 'fly':return ['jump',1+((t>>3)&1)]; // wings beating
    case 'morph':return ['spell',f.st<50?Math.min(6,f.st/7|0):Math.max(0,6-((f.st-50)/6|0))];
    case 'grow':return ['spell',Math.min(6,f.st/8|0)];
    case 'shrink':return ['hurt',1];
    case 'giant':return f.gm==='slam'?['thrust',Math.min(7,f.gt/5|0)]:f.gm==='roar'?['spell',5]:['run',(t/(f.gm==='lunge'?2:5)|0)%8];
    case 'hurt':case 'grabbed':return ['hurt',1];
    case 'fall':return ['hurt',Math.min(5,1+(f.st/3|0))];
    case 'getup':return ['hurt',Math.max(0,5-(f.st/3|0))];
    default:return ['hurt',5];
  }
}

function bgTrain(){ // night run on the roof of a speeding train: the scenery rushes past (t), the roof scrolls with the camera

const rank=()=>RANKS.filter(r=>G.style>=r.v).pop();
function styleHit(e,dmg){G.combo++;G.comboT=100;G.style=Math.min(100,G.style+(e.y>0?6:3.5));G.score+=Math.round(dmg*rank().m)}

const PROP_OF={street:'barrel',train:'barrel',skycell:'barrel',temple:'amphora',olympus:'amphora'},PROPCOL={barrel:['#7a4a22','#9a6a3a','#3a2a1a'],amphora:['#c0602a','#e08040','#222'],barrier:['#d22','#fff','#555'],vent:['#9aa2ac','#c8ced6','#4a505a'],crate:['#8a5a2a','#b0804a','#4a2a10']};
const WPN={pipe:{dmg:18,v:6},rock:{dmg:24,v:5},spear:{dmg:16,v:7.5,pierce:1}},WPN_OF={street:'pipe',train:'pipe',temple:'rock',olympus:'spear'};
function hitProp(o,dmg){
  o.hp-=dmg;SFX.hit();burst(o.x,o.z,10,4,PROPCOL[o.kind],1.5,.1,12);if(o.hp>0)return;
  G.shake=Math.max(G.shake,3);SFX.heavy();burst(o.x,o.z,8,16,PROPCOL[o.kind],2.5,.12,24);G.score+=30;
  if(o.obs)return;const r=Math.random(),it={x:o.x,z:o.z,taken:false};
  if(r<.3)G.items.push({...it,type:'hp'});else if(r<.55)G.items.push({...it,type:'en'});else if(r<.85)G.items.push({...it,type:'wpn',w:WPN_OF[G.L.theme]});
}
function throwWpn(p){const w=WPN[p.wpn];pshot(p,'wpn',w.v,w.dmg*pw(p),{w:p.wpn,kd:true,pierce:!!w.pierce,r:7,life:80});p.wpn=null;p.state='throw';p.st=0;SFX.swing()}
function spawnEnemy(kind,side){
  const k=EK[kind],e={k,kind,x:side>0?G.camX+W+20:G.camX-20,z:rand(ZMIN+5,ZMAX-5),y:0,vy:0,vx:0,dir:-side,hp:k.hp,maxhp:k.hp,state:'walk',st:0,cd:rand(30,80)|0,mcd:k.boss?150:rand(60,140)|0,walk:0,inv:0,flashT:0,hits:new Set(),s:k.s,zoff:rand(-25,25),armor:0,hc:0,eng:false,slot:0};
  G.enemies.push(e);if(k.boss){G.boss=e;G.bossBanner=120}
  if(k.invuln){e.x=G.camX+W-70;G.amb={t:0};G.flash=12;G.shake=10;bolts.push({x:e.x,z:e.z,life:16,col:'#ffe14d'});SFX.zap();SFX.heavy()} // Zeus strikes down
  return e;
}
// juggle: an enemy knocked into the air can be hit again (a few times) before it lands
const juggle=e=>!e.isPlayer&&e.state==='fall'&&e.y>4&&(e.jug|0)<(e.k.boss?2:5);
const canHit=e=>e.hp>0&&!(e.inv>0)&&!(e.ally>0)&&!(e.state==='roll'&&e.st<15)&&(juggle(e)||!['fall','down','getup','dead','morph','grow','giant','shrink'].includes(e.state));
function inRange(a,b,reach){const dx=(b.x-a.x)*a.dir;if(!(dx>-6&&dx<reach))return false;
  if(G&&G.plat)return Math.abs((b.z-b.cy)-(a.z-a.cy))<b.hh+16; // platforms: body centres
  return Math.abs(b.z-a.z)<9&&Math.abs(b.y-a.y)<32}

function damage(e,dmg,dir,kb,kd,src){
  if(e.isPlayer&&G.amb)dmg=Math.min(dmg,Math.max(0,e.hp-1)); // Zeus' ambush can't kill: the storm does the rest
  if(e.shield>0||(e.k&&e.k.invuln)){e.flashT=3;SFX.shot();burst(e.x,e.z,24*e.s,6,['#fff','#9df','#ffe14d'],2,0,10);return} // Zeus' lightning shield: immune
  if(e.isPlayer&&e.state==='guard'&&dir===-e.dir){ // guarding, hit from the front
    if(e.st<=10){ // parry window: no damage, attacker stunned
      G.hitstop=8;e.en=Math.min(100,e.en+10);SFX.confirm();burst(e.x+e.dir*12,e.z,24,12,['#fff','#ffe14d','#9df'],2.5,.1,14);
      arcs.push({x:e.x+e.dir*10,z:e.z,y:24,r:6,grow:2,life:10,max:10,col:'#fff',full:true,w:2});
      if(src&&src.k)Object.assign(src,{stun:src.k.boss?30:70,armor:0,state:'idle'});
      return}
    e.hp=Math.max(1,e.hp-dmg*.2);e.x-=e.dir*2;e.flashT=3;SFX.hit();burst(e.x+e.dir*10,e.z,24,4,['#fff','#aaa'],1.5,.1,8);return}
  if(e.isPlayer&&e.form>0&&perk(G.char,'armor')&&e.hp>dmg*.6){e.hp-=dmg*.6;e.flashT=4;G.hitstop=3;SFX.hit();return} // form super armour
  if(src&&src.isPlayer&&src.invis>0){dmg*=2;src.invis=0;burst(e.x,e.z,24,12,['#fff','#9df'],2.5,.1,14)} // strike from invisibility: double damage
  if(e.isPlayer&&src&&src.kind==='indigo'){e.en=Math.max(0,e.en-15);src.hp=Math.min(src.maxhp,src.hp+4);burst(e.x,e.z,24,10,['#7a6cff','#fff'],1.5,-.05,14)}
  if(e.isPlayer){e.invis=0;G.astral=null;
    if(e.hp-dmg<=0&&G.char.id==='hawkees'&&!G.rw&&G.hist.length>5){const s=G.hist[0];G.rw=1;G.rwT=50;G.hist=[]; // time rewind: undo a KO once per level
      Object.assign(e,{hp:Math.max(s.hp,40),x:s.x,z:s.z,y:0,vy:0,state:'idle',st:0,atk:null,inv:90});G.flash=10;tone('sawtooth',1200,100,.7,.08);return}}
  if(e.isPlayer)styleDrop();else if(dmg>0&&dmg<999)styleHit(e,dmg);
  if(src&&src.isPlayer)src.en=Math.min(100,src.en+(G.fly?2:5));
  if(G.fly||G.plat){ // sky / platform levels: no knockdown, hits flash (and push back on platforms)
    e.hp-=dmg;e.flashT=4;G.hitstop=Math.max(G.hitstop,2);
    if(G.plat&&!(e.k&&e.k.boss)){e.kx=dir*(kb*.8+1);if(!e.isPlayer)e.hs=12}
    if(e.isPlayer){e.inv=70;SFX.hurt();G.shake=6}else SFX.hit();
    if(e.hp<=0&&e.kind==='cerberus'){Object.assign(e,{hp:0,state:'flee',st:0,dir:1});G.boss=null;G.flash=12;G.score+=Math.round(e.k.score*rank().m);tone('sawtooth',500,150,.7,.1);return} // beaten, not killed
    if(e.hp<=0){e.state='dead';e.st=0;burst(e.x,e.z,0,20,['#fff','#fc6','#888'],2.5,0,20);onDeath(e)}
    return}
  e.hp-=dmg;G.hitstop=Math.max(G.hitstop,kd?5:3);
  if(e.hp<=0&&e.k&&e.k.next)return startMorph(e);
  if(e.isPlayer)e.en=Math.min(100,e.en+3);
  if(e.y>0)kd=true;
  if(e.hp<=0||kd){
    if(e.armor&&e.hp>0){e.flashT=4;SFX.hit();return}
    if(e.state==='fall')e.jug=(e.jug|0)+1;
    if(e.isPlayer)e.wpn=null; // knocked down: drops the weapon
    Object.assign(e,{state:'fall',st:0,vy:e.hp<=0?3.5:e.state==='fall'?2.4:3,vx:dir*(e.state==='fall'?1.3:kb*.8+1),dir:-dir,armor:0});
    G.shake=Math.max(G.shake,6);(e.isPlayer?SFX.hurt:SFX.heavy)();
  }else{
    if(e.armor){e.flashT=4;SFX.hit();return}
    if(e.k&&e.k.boss&&++e.hc>=4){e.hc=0;e.state='windup';e.st=10;e.armor=1;SFX.hit();return}
    e.state='hurt';e.st=0;e.vx=dir*kb;(e.isPlayer?SFX.hurt:SFX.hit)();
  }
}
function onDeath(f){
  SFX.ko();if(f.isPlayer)return;
  G.score+=Math.round(f.k.score*rank().m);
  if(f.k.boss){G.flash=20;G.shake=20;G.boss=null;unlock(f.kind);for(const o of G.enemies)if(o!==f&&o.hp>0)damage(o,999,o.x>f.x?1:-1,3,true,null)}
  else if(Math.random()<.2)G.items.push({x:f.x,z:f.z,taken:false,type:G.fly?'en':'hp'});
}
// shared reactions (hurt / knockdown / death) for player and enemies
function updateReact(f){
  if(f.state==='hurt'){f.x+=f.vx;f.vx*=.8;if(++f.st>(f.isPlayer?14:18)){f.state='idle';if(!f.isPlayer)f.cd=Math.max(f.cd,25)}return true}
  if(f.state==='fall'){f.st++;f.y+=f.vy;f.vy-=GRAV;f.x+=f.vx;
    if(f.thrown)for(const o of G.enemies)if(o!==f&&canHit(o)&&Math.abs(o.x-f.x)<14&&Math.abs(o.z-f.z)<8){ // thrown body bowls others over
      damage(o,10*pw(G.p),Math.sign(f.vx)||1,3,true,G.p);burst(o.x,o.z,18,8,['#fff','#fc6'],2,.1,12)}
    if(!f.isPlayer&&!f.wb&&Math.abs(f.vx)>2.5&&(f.x<G.camX+10||f.x>G.camX+W-10)){ // wall bounce off the screen edge: free juggle
      f.wb=1;f.vx=-f.vx*.5;f.vy=Math.max(f.vy,2.5);f.jug=0;G.shake=6;SFX.heavy();burst(f.x,f.z,20,10,['#fff','#ccc'],2,.1,14)}
    if(f.y<=0&&f.st>2){f.y=0;f.vx=0;f.jug=0;f.wb=0;if(f.thrown){f.thrown=0;G.shake=Math.max(G.shake,5)}burst(f.x,f.z,0,6,['#999','#777'],1.2,.05,14);if(f.hp<=0){f.state='dead';f.st=0;onDeath(f)}else{f.state='down';f.st=0}}return true}
  if(f.state==='down'){if(++f.st>(f.isPlayer?30:45)){f.state='getup';f.st=0}return true}
  if(f.state==='getup'){if(++f.st>14){f.state='idle';f.st=0;f.inv=f.isPlayer?60:10}return true}
  if(f.state==='dead'){f.st++;return true}
  return false;
}

const pw=p=>G.char.pow*(p.form>0?1.35:1); // power-up form: +35% damage
const perk=(c,k)=>c.form.perks.includes(k);
function nearest(f,R,skip){let b=null,bd=R;for(const e of G.enemies)if(e!==skip&&canHit(e)){const d=Math.hypot(e.x-f.x,(e.z-f.z)*2);if(d<bd){bd=d;b=e}}return b}
function startAtk(p,i){
  const c=G.char,b=PATK[i],bl=c.mfx==='slash';
  p.atk={...b,su:bl?b.su-1:b.su,reach:b.reach+c.reach,dmg:b.dmg*pw(p)};
  if(bl&&i===2)p.atk.pose='punch';
  p.combo=i;p.state='atk';p.st=0;p.buf=false;p.hits.clear();
  if(bl||c.mfx==='claw'){SFX.slash();arcs.push({x:p.x+p.dir*10,z:p.z,y:22,dir:p.dir,r:14+i*3,life:8,max:8,col:c.col[0]})}else SFX.swing();
}
function hitScan(f,a){
  const c=G.char,m=c.mfx;
  for(const e of G.enemies){
    if(f.hits.has(e)||!canHit(e)||!inRange(f,e,a.reach+6*e.s))continue;
    const air=e.y>4;f.hits.add(e);damage(e,a.dmg,f.dir,a.kb,a.kd,f);
    if(a.launch&&e.state==='fall'&&!e.k.boss){e.vy=5.2;e.vx=f.dir*.5} // combo finisher launches upward
    if(air&&f.y>0)f.vy=Math.max(f.vy,1.6); // air combo: hitting a juggled enemy keeps you aloft
    const hx=e.x-f.dir*4*e.s,hy=f.y+22;
    if(m==='bolt'){burst(hx,e.z,hy,6,c.col,2.5,.1,14);if(a.kd)bolts.push({x:e.x,z:e.z,life:6,col:'#9df'})}
    else if(m==='flame')burst(hx,e.z,hy,8,c.col,1.8,-.05,18);
    else burst(hx,e.z,hy,6,['#fff',c.col[0]],2.5,.1,12);
    if(f.form>0)formHit(c,e,a.dmg);
  }
  for(const o of G.props)if(o.hp>0&&!f.hits.has(o)&&inRange(f,o,a.reach+6)){f.hits.add(o);hitProp(o,a.dmg)}
}
// bare-handed fighters: a short bolt / flame jet shows their extra reach
function atkFx(p,a){
  const c=G.char,m=c.mfx,y=a.pose==='kick'?12:24,x0=p.x+p.dir*10,x1=p.x+p.dir*(a.reach+4);

    else if(m==='flame')for(let i=0;i<7;i++)part(x0+p.dir*i*3,p.z,y+rand(-2,2),p.dir*rand(1.2,2.6),rand(-.2,.4),rand(8,14)|0,pick(c.col),pick([2,3]),-.05);

  dash(p,c){if(p.st>=4&&p.st<20){p.x+=p.dir*7;part(p.x,p.z,20,0,0,10,c.col[1],6,0);dashHits(p,c,18)}return p.st>=28},

    if(p.st>=8&&p.st<=24&&p.st%8===0){const x=p.x+p.dir*(p.st/8)*30;G.shake=5;SFX.fire();

      for(const e of G.enemies)if(canHit(e)&&Math.abs(e.x-x)<16&&Math.abs(e.z-p.z)<14)damage(e,16,p.dir,1.5,true,null)}
    return p.st>=32},

  pounce(p,c){ // Beast: leaps onto the nearest enemy, shockwave on landing

  spread(p){if(p.st>=8&&p.st<=24&&p.st%4===0){pshot(p,'bullet',7.5,9*pw(p),{vz:(p.st-16)/8*.6});SFX.shot();burst(p.x+p.dir*20,p.z,24,3,['#ff3','#fff'],1.2,0,6)}return p.st>=30},
  lunge(p,c){if(p.st>=3&&p.st<13){p.x+=p.dir*6.5;part(p.x,p.z,22,0,0,10,c.col[2],5,0);dashHits(p,c,22,20)}return p.st>=24},
  flamewave(p){if(p.st===10){G.shake=5;pshot(p,'flame',4,16*pw(p),{y:2,r:9,pierce:true,life:110})}return p.st>=24},

      for(let i=0;i<3;i++)G.haz.push({kind:'mark',owner:'p',x:G.camX+rand(30,W-30),z:rand(ZMIN+4,ZMAX-4),r:20,life:55+i*10,max:55+i*10})}

/* ---------- GUARD / ROLL / GRAB ---------- */
function startRoll(p,dx,dz){if(G.char.id==='thunder')return teleport(p,dx,dz);Object.assign(p,{state:'roll',st:0,rdx:dx,rdz:dz,dir:dx||p.dir});SFX.jump()}
function tryGrab(p,dx){ // walking into a regular enemy grabs it
  for(const e of G.enemies)if(!e.k.boss&&e.y===0&&canHit(e)&&['idle','walk','windup','hurt'].includes(e.state)){const d=(e.x-p.x)*dx;
    if(d>0&&d<15*e.s&&Math.abs(e.z-p.z)<5){Object.assign(p,{state:'grab',st:0,held:e,kn:0,knees:0,dir:dx});Object.assign(e,{state:'grabbed',st:0,armor:0,stun:0});SFX.hit();return}}
}
function releaseGrab(p){const e=p.held;Object.assign(p,{held:null,state:'idle',grabCd:30});if(e&&e.state==='grabbed'){e.state='idle';e.cd=15}}
function updateGrab(p,dx){
  const e=p.held;if(p.kn>0)p.kn--;
  if(!e||e.state!=='grabbed'||p.st>110)return releaseGrab(p); // the enemy breaks free
  if(pressed('jump')){e.state='idle';e.stun=40;Object.assign(p,{state:'jump',st:0,vy:4.6,jdx:p.dir*2.6,atk:null,held:null,grabCd:30});SFX.jump();return} // vault over
  if(pressed('power')&&G.char.id==='thunder'&&p.en>=POW_COST)return mindControl(p,e);
  if(!pressed('attack'))return;
  if(dx){ // throw (forward or backward)
    Object.assign(p,{held:null,state:'throw',st:0,dir:dx,grabCd:30});Object.assign(e,{state:'idle',thrown:1,x:p.x+dx*10});
    damage(e,12*pw(p),dx,4.5,true,p);G.shake=6;return}
  const last=++p.knees>=3;p.kn=8;e.state='idle'; // knee strike, the third one knocks down
  damage(e,5*pw(p),p.dir,last?3:0,last,p);burst(e.x,e.z,18,6,['#fff',G.char.col[0]],2,.1,12);
  if(e.state==='hurt')e.state='grabbed';else Object.assign(p,{held:null,state:'idle',grabCd:30});
}

/* ---------- HERO POWERS (D/G, ¼ gauge) ---------- */
const POW_COST=25;
function power(p,c){
  if(p.en<POW_COST||!['thunder','hawkees','necrosis','aetos','karnak'].includes(c.id))return;
  p.en-=POW_COST;
  if(c.id==='necrosis'){const en=p.en;startForm(p,c);p.form=300;p.en=en;return} // quick Hyde
  if(c.id==='aetos'){G.astral={x:p.x,z:p.z,y:0,dir:p.dir,t:300,at:0,hits:new Set()};SFX.zap();burst(p.x,p.z,24,16,['#8cf','#fff'],2,-.05,16);return}
  if(c.id==='karnak'){p.state='special';p.sp=0;p.st=0;G.shake=5;SFX.heavy();pshot(p,'fire',6,24*pw(p),{kd:true,r:9,pierce:true,life:70});return} // rocket punch
  if(c.id==='thunder'){p.invis=180;SFX.zap();burst(p.x,p.z,24,16,['#9df','#fff'],2,0,14)} // enemies lose track of you for 3 s
  else{G.slow=240;SFX.fire();tone('triangle',300,60,.8,.08)} // Hawkees: everything else runs at half speed for 4 s
}
function teleport(p,dx,dz){ // Thunderstruck's roll: blink behind the nearest enemy that way (or a short jump)
  let e=null,bd=160;if(dx)for(const o of G.enemies){const d=(o.x-p.x)*dx;if(canHit(o)&&d>0&&d<bd&&Math.abs(o.z-p.z)<40){bd=d;e=o}}
  const x0=p.x,z0=p.z;
  if(e){p.x=e.x+dx*20;p.z=e.z;p.dir=-dx}else{p.x+=dx*70;p.z+=dz*30;if(dx)p.dir=dx}
  p.z=clamp(p.z,ZMIN,ZMAX);p.state='idle';p.st=0;p.inv=Math.max(p.inv,14);SFX.zap();
  for(const [x,z] of[[x0,z0],[p.x,p.z]]){bolts.push({x,z,life:8,col:'#9df'});burst(x,z,24,10,['#fff','#9df','#ffe14d'],2,0,12)}
}
function mindControl(p,e){ // Thunderstruck: the grabbed thug fights for you for 8 s, then collapses
  p.en-=POW_COST;Object.assign(p,{held:null,state:'idle',grabCd:30});Object.assign(e,{state:'idle',ally:480,cd:20,st:0,stun:0});SFX.zap();
  links.push({x0:p.x,y0:p.z-30,x1:e.x,y1:e.z-30,life:12});burst(e.x,e.z,30,14,['#c6f','#fff'],2,0,16);
}
function updateAstral(p){const A=G.astral,dx=(held.right?1:0)-(held.left?1:0),dz=(held.down?1:0)-(held.up?1:0);
  p.state='idle';if(--A.t<=0||pressed('power')){G.astral=null;burst(p.x,p.z,24,10,['#8cf','#fff'],2,-.05,14);return}
  if(dx)A.dir=dx;A.x=clamp(A.x+dx*2.6,G.camX+10,G.camX+W-10);A.z=clamp(A.z+dz*1.8,ZMIN,ZMAX);
  if(A.at>0){if(++A.at>=4&&A.at<8)hitScan(A,{reach:26,dmg:12*pw(p),kb:2.5,kd:A.at===4&&(A.n|0)%3===2});if(A.at>14)A.at=0}

function phantomRun(p){ // super speed: every enemy brushed past freezes, then they all fall at once

/* ---------- POWER-UP FORM (hold charge 1 s at full gauge) ---------- */

function formHit(c,e,dmg){

function pickups(p){

    if(it.type==='en'){p.en=Math.min(100,p.en+40);burst(it.x,it.z,6,10,['#4af','#fff'],1.5,.05,16)}
    else{p.hp=Math.min(p.maxhp,p.hp+30);burst(it.x,it.z,6,10,['#7f7','#fff'],1.5,.05,16)}}
}
function updatePlayer(p){
  const c=G.char;
  if(p.inv>0)p.inv--;if(p.grabCd>0)p.grabCd--;if(p.flashT>0)p.flashT--;
  if(p.state==='dead'){if(++p.st>90){if(--G.lives>0)respawn(p);else{state='gameover';G.endT=0}}return}
  if(p.charged>0&&--p.charged%4===0)burst(p.x+p.dir*8,p.z,24,1,['#ffe14d','#9df'],1,0,8);
  if(p.form>0)updateForm(p,c);
  if(p.invis>0)p.invis--;
  if(G.cutT>0&&--G.cutT===0)phantomCut(p);
  if(c.id==='hawkees'&&t%10===0&&p.hp>0){G.hist.push({hp:p.hp,x:p.x,z:p.z});if(G.hist.length>18)G.hist.shift()} // last 3 s, for the rewind
  if(updateReact(p))return;
  if(G.astral)return updateAstral(p);
  p.st++;
  const dx=(held.right?1:0)-(held.left?1:0),dz=(held.down?1:0)-(held.up?1:0);
  if(p.state==='idle'||p.state==='walk'){
    if(p.en>=50&&(pressed('special')||pressed('special2')))return startSpecial(p,pressed('special2')?2:1);
    if(pressed('power'))power(p,c);
    if(pressed('guard')){if(dx||dz)startRoll(p,dx,dz);else{p.state='guard';p.st=0}return}
    if(held.charge){p.state='power';p.st=0;p.pf=0;return}
    if(pressed('jump')){Object.assign(p,{state:'jump',st:0,vy:4.4,jdx:dx*1.7*c.spd,atk:null,ja:0});SFX.jump();return}
    if(pressed('attack')){
      if(p.wpn)return throwWpn(p);
      const w=G.items.find(i=>i.type==='wpn'&&!i.taken&&Math.abs(i.x-p.x)<14&&Math.abs(i.z-p.z)<9);
      if(w){w.taken=true;p.wpn=w.w;SFX.pickup();return}
      return startAtk(p,0)}
    for(const d of[-1,1])if(pressed(d<0?'left':'right')){ // double tap: sprint
      if(p.tapD===d&&t-p.tapT<14){Object.assign(p,{state:'dash',st:0,dir:d,trail:[]});tone('square',300,600,.08,.04);return}
      p.tapD=d;p.tapT=t}
    if(dx)p.dir=dx;
    const sp=c.spd*(p.form>0?(perk(c,'fast')?1.4:1.2):1);
    p.x+=dx*1.5*sp;p.z+=dz*sp;

  }else if(p.state==='dash'){

    if(pressed('jump')){Object.assign(p,{state:'jump',st:0,vy:4.4,jdx:p.dir*3*c.spd,atk:null,ja:0});SFX.jump();return}
    if(pressed('guard'))return startRoll(p,p.dir,dz);

    p.x+=p.dir*3*c.spd*(c.id==='phantom'?1.6:1);p.z+=dz*c.spd;p.walk+=2;if(p.st%4===0)burst(p.x-p.dir*6,p.z,1,2,['#aaa','#888'],.6,.02,10);

    if(p.st>=22)p.state='idle';
  }else if(p.state==='guard'){
    if(!held.guard)p.state='idle';
    else if((dx||dz)&&['left','right','up','down'].some(a=>pressed(a)))startRoll(p,dx,dz);
  }else if(p.state==='roll'){
    p.x+=p.rdx*3.2;p.z+=p.rdz*2;if(p.st%3===0)part(p.x-p.dir*6,p.z,6,0,.2,10,'#aaa',2,0);
    if(p.st>=18){p.state=held.guard?'guard':'idle';p.st=0}
  }else if(p.state==='grab')updateGrab(p,dx);
  else if(p.state==='throw'){if(p.st>=16)p.state='idle'}
  else if(p.state==='atk'){
    const a=p.atk;
    if(pressed('attack'))p.buf=true;
    p.hold=held.attack?(p.hold||0)+1:0;
    if(p.combo===0&&p.hold>=12&&p.st>=a.su+a.ac){p.state='hold';p.st=0;p.ch=0;return} // held past the first jab: charge up
    if(p.combo===2&&p.st>=a.su+a.ac&&pressed('jump')){Object.assign(p,{state:'jump',st:0,vy:4.8,jdx:p.dir*1.6,atk:null,ja:0});SFX.jump();return} // jump after the launcher
    if(p.charged>0){if(p.st===a.su)shootZap(p,a)}
    else if(p.st>=a.su&&p.st<a.su+a.ac){hitScan(p,a);atkFx(p,a)}
    if(p.st>=a.su+a.ac+a.rc){if(p.buf&&p.combo<2)startAtk(p,p.combo+1);else p.state='idle'}
  }else if(p.state==='jump'){
    p.y+=p.vy;p.vy-=GRAV;p.x+=p.jdx;
    if(c.id==='hawkees'&&held.jump&&p.vy<0&&(p.fl|0)<150){p.fl=(p.fl|0)+1;p.vy=-.12;p.jdx=0;p.x+=dx*1.8;p.z+=dz;if(t%2===0)part(p.x+rand(-4,4),p.z,p.y+2,rand(-.3,.3),-rand(.5,1.2),12,pick(c.col),2,0)}
    if(p.atk)p.at++;
    if(pressed('attack')&&(!p.atk||p.at>12)&&(p.ja|0)<3){ // up to 3 air attacks per jump
      p.atk={...JATK,reach:JATK.reach+c.reach,dmg:JATK.dmg*pw(p)};p.at=0;p.ja=(p.ja|0)+1;p.hits.clear();(c.mfx==='slash'?SFX.slash:SFX.swing)()}
    if(p.atk&&p.at<10)hitScan(p,p.atk);
    if(p.y<=0){p.y=0;p.state='idle';p.atk=null;p.ja=0;p.fl=0;burst(p.x,p.z,0,4,['#aaa'],1,.05,12)}
  }else if(p.state==='power'){
    if(!held.charge){p.state='idle';return}
    if(p.en>=50&&(pressed('special')||pressed('special2')))return startSpecial(p,pressed('special2')?2:1);
    const was=p.en;p.en=Math.min(100,p.en+.4);
    if(was<100&&p.en>=100){G.flash=6;G.shake=6;SFX.confirm();burst(p.x,p.z,20,30,c.col,3,.05,24)}
    if(p.en<100&&p.st%8===0)tone('sawtooth',80+p.en*4,110+p.en*4,.12,.035);
    if(p.en>=100&&!(p.form>0)){if(++p.pf>=60)return startForm(p,c);if(p.pf%6===0)tone('sawtooth',300+p.pf*12,340+p.pf*12,.1,.04)} // keep holding: transformation
    powerFx(p);
  }else if(p.state==='special')updateSpecial(p);
  else if(p.state==='hold'){
    if(!held.attack){if(p.ch>=CH_MIN){p.state='catk';p.st=0;p.full=p.ch>=CH_FULL;p.hits.clear();SFX.swing()}else p.state='idle';return}
    if(++p.ch===CH_FULL){G.flash=3;SFX.confirm();burst(p.x,p.z,22,16,c.col,2.5,.05,18)}
    if(p.ch<CH_FULL&&p.ch%6===0)tone('triangle',200+p.ch*8,240+p.ch*8,.08,.03);
    chargeFx(p);
  }else if(p.state==='catk'){if(CATK[c.ca](p,c,p.full?1.5:1,pw(p)))p.state='idle'}
}
/* ---------- CHARGED ATTACK (hold attack) ---------- */
const CH_MIN=20,CH_FULL=60;
function chargeFx(p){
  const k=Math.min(1,p.ch/CH_FULL),col=G.char.col;
  if(p.ch%Math.max(1,6-(k*5|0))===0){const a=rand(0,6.3),r=22-k*6; // particles converge on the fist
    part(p.x+Math.cos(a)*r,p.z+Math.sin(a)*3,24+Math.sin(a)*r*.6,-Math.cos(a)*1.2,-Math.sin(a)*.6,12,pick(col),k>.99?2:1,0)}
  if(p.ch>=CH_FULL&&p.ch%10===0)arcs.push({x:p.x,z:p.z,y:22,r:10,grow:1.2,life:10,max:10,col:col[0],full:true,w:1});
}
function dotOn(e,dmg,n,col){e.dot=n;e.dotD=dmg;e.dotC=col}
const CATK={ // f: full-charge multiplier; return true when finished
  chain(p,c,f,pow){ // chain lightning: first target, then jumps to neighbours; all paralysed
    if(p.st===5){let src=null,best=1e9;const front=e=>(e.x-p.x)*p.dir>-8;
      for(const e of G.enemies)if(canHit(e)&&front(e)&&Math.abs(e.z-p.z)<12){const d=Math.abs(e.x-p.x);if(d<40+(p.full?20:0)&&d<best){best=d;src=e}}
      G.shake=p.full?8:5;SFX.zap();
      if(!src)burst(p.x+p.dir*20,p.z,24,8,c.col,2,.05,12);
      const chain=[];let cur=src;
      while(cur&&chain.length<(p.full?4:3)){chain.push(cur);let nx=null,nb=90;
        for(const e of G.enemies)if(canHit(e)&&!chain.includes(e)){const d=Math.hypot(e.x-cur.x,(e.z-cur.z)*2);if(d<nb){nb=d;nx=e}}cur=nx}
      let px=p.x+p.dir*14,py=p.z-24;
      for(const e of chain){links.push({x0:px,y0:py,x1:e.x,y1:e.z-24*e.s,life:14});px=e.x;py=e.z-24*e.s;
        damage(e,14*pow*f,p.dir,1,false,p);if(!(e.shield>0))e.stun=(e.k.boss?45:110)*f|0;bolts.push({x:e.x,z:e.z,life:8,col:'#9df'});burst(e.x,e.z,24,10,c.col,2.5,.1,16)}
      if(chain.length)G.flash=4}
    return p.st>=22},
  cross(p,c,f,pow){ // dash cross-slash, leaves a bleed
    if(p.st>=2&&p.st<10){p.x+=p.dir*(p.full?6:4.5);part(p.x,p.z,20,0,0,10,'#8a4ab0',5,0)}
    if(p.st===6){SFX.slash();
      arcs.push({x:p.x+p.dir*12,z:p.z,y:28,dir:p.dir,r:26,life:12,max:12,col:'#fff',w:2},{x:p.x+p.dir*12,z:p.z,y:14,dir:-p.dir,r:26,life:12,max:12,col:'#c9c9ff',w:2})}
    if(p.st>=4&&p.st<12)for(const e of G.enemies)if(canHit(e)&&!p.hits.has(e)&&Math.abs(e.x-p.x)<36&&Math.abs(e.z-p.z)<14){p.hits.add(e);
      damage(e,12*pow*f,p.dir,2.5,false,p);dotOn(e,3*f,p.full?8:5,'#d22');burst(e.x,e.z,22,12,['#fff','#d22','#900'],2.5,.15,16)}
    return p.st>=24},
  slam(p,c,f,pow){ // fire slam: knocks everything back and sets it on fire
    if(p.st===6){G.shake=p.full?12:8;SFX.fire();SFX.heavy();shockwave(p,p.full?70:52,16*pow*f,p.full?6:4.5,c.col,e=>dotOn(e,2.5*f,p.full?8:5,'#f60'))}
    return p.st>=26},
  roar(p,c,f){ // Beast: roar that stuns everything around
    if(p.st===6){G.shake=10;SFX.heavy();tone('sawtooth',160,50,.6,.12);
      for(let i=0;i<3;i++)arcs.push({x:p.x+p.dir*8,z:p.z,y:28,r:6+i*6,grow:3,life:16,max:16,col:c.col[i%2],full:true,w:2});
      for(const e of G.enemies)if(canHit(e)&&Math.hypot(e.x-p.x,(e.z-p.z)*2)<80*f){damage(e,6*f,Math.sign(e.x-p.x)||1,2,false,p);if(!(e.shield>0))e.stun=(e.k.boss?40:100)*f|0}}
    return p.st>=30},
  bigshot(p,c,f,pow){ // Deadeye: heavy bolt, pierces when fully charged
    if(p.st===6){pshot(p,'bullet',10,18*pow*f,{kd:true,pierce:p.full,r:8});SFX.shot();SFX.heavy();G.shake=5;burst(p.x+p.dir*20,p.z,24,10,['#ff3','#fff'],2,0,10)}
    return p.st>=20},
  spin(p,c,f,pow){ // Ares: double spinning slash that burns
    if(p.st===6||p.st===14){SFX.slash();arcs.push({x:p.x,z:p.z,y:22,r:30,life:8,max:8,col:c.col[0],full:true,w:3});
      for(const e of G.enemies)if(canHit(e)&&Math.abs(e.x-p.x)<44&&Math.abs(e.z-p.z)<14){damage(e,10*pow*f,Math.sign(e.x-p.x)||1,3,p.st===14,p);dotOn(e,2*f,p.full?7:4,'#f60');burst(e.x,e.z,22,8,c.col,2,-.05,14)}}
    return p.st>=24},
};

/* ---------- BOSSES: moves, two forms ---------- */
const BWIND={charge:40,pounce:22,snipe:44,volley:28,flameslash:26,bolt:28,shield:24,fly:20,storm:34,arrow:30}; // telegraph length per move
function startBossMove(e,p){
  let m=pick(e.k.moves);
  if(m==='shield'&&e.shield>0)m='storm';
  const [a,b]=e.k.mcd||[150,230];
  Object.assign(e,{mcd:rand(a,b)|0,move:m,state:'bwind',st:0,armor:e.k.boss?1:0,lockz:p.z,shots:0});
  if(m==='charge')tone('sawtooth',90,50,.5,.12);
  if(m==='snipe'||m==='volley')tone('square',1200,1250,.08,.04);
  if(m==='bolt'||m==='storm'||m==='shield')tone('sawtooth',300,900,.4,.05);
}
function shootAt(e,p,kind,spd,dmg,dz=0){const d=e.dir,x=e.x+d*18*e.s,y={bullet:24,ezap:28,flame:2,arrow:26}[kind];
  G.proj.push({owner:'e',kind,x,z:e.z,y,vx:d*spd,vz:clamp((p.z+dz-e.z)/Math.max(8,Math.abs(p.x-x)/spd),-.8,.8),dmg,r:kind==='flame'?9:5,life:150,hits:new Set()})}
function bossWind(e,p){

  if(m==='snipe'){if(e.st<34){e.dir=d;e.aimz=p.z}             // laser sight tracks, then locks 10 frames before the shot
    if(e.st>=BWIND.snipe){shootAt(e,{z:e.aimz},'bullet',9,13);SFX.shot();G.shake=3;burst(e.x+e.dir*20*e.s,e.z,24,6,['#ff3','#fff'],1.5,0,8);e.state='idle';e.armor=0;e.cd=40}return}
  if(m==='volley'){e.dir=d;if(e.st>=16&&e.st%6===4&&e.shots<3){e.shots++;shootAt(e,p,'bullet',7.5,8,(e.shots-2)*10);SFX.shot();burst(e.x+e.dir*20*e.s,e.z,24,3,['#ff3','#fff'],1.2,0,6)}
    if(e.st>=BWIND.volley+14){e.state='idle';e.armor=0;e.cd=40}return}

  if(m==='fly'){if(e.st>=BWIND.fly){e.state='fly';e.st=0;e.armor=0;SFX.zap();burst(e.x,e.z,0,16,['#fff','#ffe14d'],2,.05,16)}return}
  if(e.st<BWIND[m])return;

  if(m==='bolt'){shootAt(e,p,'ezap',5.5,13);SFX.zap()}

  if(m==='flameslash'){e.state='strike';e.st=0;e.hits.clear();e.combo=(k.combo||1)-1;shootAt(e,p,'flame',4,14);SFX.fire();G.shake=4}
  if(m==='shield'){e.shield=200;SFX.zap();G.flash=4}
  if(m==='storm'){SFX.zap();for(let i=0;i<5;i++)G.haz.push({kind:'mark',x:i?clamp(p.x+rand(-120,120),G.camX+15,G.camX+W-15):p.x,z:i?rand(ZMIN+4,ZMAX-4):p.z,r:18,life:150+i*12,max:150+i*12})}
}

  G.cut={t:0,x,then,k:0,ax:null,civ:[0,1,2].map(i=>({i,x:x-170+i*30,z:ZMIN+14+i*20,up:0,gone:0}))};
  Object.assign(G,{enemies:[],proj:[],haz:[],items:[],boss:null});G.props=G.props.filter(o=>!o.obs);
  Object.assign(G.p,{state:'idle',st:0,y:0,x:G.camX+60,z:186,dir:1,atk:null,wpn:null});state='play';
}
function updateCut(){
  const C=G.cut,p=G.p,T=++C.t;
  C.k=C.done?Math.max(0,C.k-.03):Math.min(1,T/40);
  if(t%2===0&&C.k>0)part(C.x+rand(-14,14)*C.k,ZMIN+30,32+rand(-30,30)*C.k,rand(-.3,.3),rand(-.3,.3),12,pick(['#f40','#a2f','#fc0']),2,0);
  if(T===40){C.ax=C.x;SFX.fire()}
  if(T>40&&T<110)C.ax-=.9; // walks out towards them
  if(T===110)return story('portalA',()=>{state='play'});
  if(T>120)for(const c of C.civ)if(!c.gone){c.x+=(C.x-c.x)*.035;c.z+=(ZMIN+30-c.z)*.03;c.up=Math.min(24,c.up+.4);if(Math.abs(C.x-c.x)<6)c.gone=1} // dragged in
  if(T>=150&&T<228)C.ax+=.9;
  if(T===228){C.ax=null;SFX.fire()}
  if(T===250)return story('portalB',()=>{state='play'});
  if(T>255&&!C.done){p.state='walk';p.walk++;p.x+=1.8;p.z+=(ZMIN+30-p.z)*.05;if(p.x>=C.x){C.done=1;p.hide=1;SFX.fire()}}
  if(C.done&&C.k<=0){G.cut=null;C.then();return}
  updateFx();tickCounters();
}
// the ambush ends in a lightning storm that knocks the hero into the Underworld
const AMB_T=480;
function updateStorm(){
  const S=G.storm,p=G.p;S.t++;G.shake=Math.max(G.shake,3);
  if(S.t%4===0){bolts.push({x:G.camX+rand(10,W-10),z:rand(ZMIN,ZMAX),life:10,col:pick(['#ffe14d','#9df','#fff'])});if(S.t%12===0)SFX.zap()}
  if(S.t===60){Object.assign(p,{state:'fall',st:0,vy:3,vx:-1.5,y:Math.max(p.y,1)});bolts.push({x:p.x,z:p.z,life:30,col:'#fff'});SFX.heavy()} // struck
  updateReact(p);
  if(S.t===200){G.lost=G.ci;cine('fall',()=>{G.pick=1;sel=(G.ci+1)%CHARS.length;state='select'})}
  updateFx();tickCounters();
}
function tickCounters(){
  for(const k of['shake','flash','banner','go','bossBanner','unlT','formBanner','chaseBanner','msgT','slow','rwT'])if(G[k]>0)G[k]--;
  if(G.comboT>0&&--G.comboT===0)G.combo=0;
  G.style=Math.max(0,G.style-(G.comboT>0?.02:.12));
}
function updateGame(){
  const p=G.p;
  if(G.cine)return updateCine();
  if(G.fly)return updateSky();
  if(G.plat)return updatePlat();
  if(G.cut)return updateCut();
  if(G.storm)return updateStorm();
  if(G.amb&&++G.amb.t>=AMB_T){G.amb=null;G.storm={t:0};G.proj=[];G.haz=[];return story('storm',()=>{state='play'})}
  updatePlayer(p);if(state!=='play')return;
  if(G.inno)updateInno(p);
  updateChase();updateObs();
  G.enemies.filter(e=>e.hp>0).sort((a,b)=>Math.abs(a.x-p.x)-Math.abs(b.x-p.x)).forEach((e,i)=>{e.eng=!!e.k.boss||i<2;e.slot=i});
  const sl=G.slow>0&&t%2;
  if(!sl)for(const e of G.enemies){updateEnemy(e);e.x=clamp(e.x,G.camX-30,G.camX+W+30);e.z=clamp(e.z,ZMIN,ZMAX)}
  const al=G.enemies.filter(e=>e.hp>0);
  for(let i=0;i<al.length;i++)for(let j=i+1;j<al.length;j++){const a=al[i],b=al[j];if(Math.abs(a.x-b.x)<10&&Math.abs(a.z-b.z)<5){const s=a.z<b.z?-.4:.4;a.z+=s;b.z-=s}}
  G.enemies=G.enemies.filter(e=>!(e.state==='dead'&&e.st>50));
  if(!sl){updateProj();updateHaz()}
  G.items=G.items.filter(i=>!i.taken);G.props=G.props.filter(o=>o.hp>0);
  updateWaves();if(state!=='play')return;
  cam=G.camX;
  p.x=clamp(p.x,G.camX+10,G.camX+W-10);p.z=clamp(p.z,ZMIN,ZMAX);
  if(G.L.theme==='train'&&t%84===0)SFX.train(); // rail rumble
  if(G.L.theme==='train'&&t%2===0)part(G.camX+W+5,rand(ZMIN-40,ZMAX),rand(0,50),-8,0,60,'rgba(255,255,255,.35)',1,0); // wind
  if(G.L.theme==='olympus'&&t%10===0)part(G.camX+rand(0,W),rand(ZMIN,ZMAX),rand(0,60),rand(-.2,.2),.25,120,pick(['#ffe14d','#fff8dc']),1,0); // golden motes
  updateFx();tickCounters();
}

// z = feet height in world pixels (down = +), y stays 0, vy > 0 goes up. camY scrolls vertically.
const TS=16,MW=120,MH=30;let HM=null,camY=0;
// rooms carved out of rock: A start hall, B upper corridor (wings), B' middle corridor (lava), D lower cave, C hub shaft, E Styx, F Cerberus' arena
function buildHell(){
  const m=[...Array(MH)].map(()=>Array(MW).fill('#')),box=(c0,r0,c1,r1,ch=' ')=>{for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)m[r][c]=ch};
  box(1,2,23,18);box(24,4,47,8);box(24,11,55,18);box(24,23,55,27);box(56,2,67,27);box(68,14,87,27);box(88,12,118,27);
  box(56,19,58,19,'#');box(56,5,58,5,'#');box(34,19,41,19,'L');box(70,28,86,28,'R'); // hub ledges, lava pit, the Styx
  for(const [c,r,n] of[[14,16,4],[18,13,4],[20,10,4],[9,13,4],[3,8,4],[35,16,5],[60,25,3],[63,22,3],[59,19,3],[62,16,3],[58,13,3],[62,10,3]])box(c,r,c+n-1,r,'=');
  return m;
}
const HELL_FOES=[['skeleton',8,19],['bat',12,8],['skeleton',32,9],['ghost',40,9],['demon',28,19],['demon',48,19],['bat',44,14],
  ['skeleton',30,28],['ghost',38,28],['bat',34,25],['bat',48,25],['demon',52,28],['bat',64,8],['ghost',60,20],['ghost',78,22]];
const HELL_ITEMS=[['W',46,9],['o',4,8],['o',26,28],['o',57,5],['S',50,28],['S',59,13]]; // wings, obols, souls (feet row)
const tile=(c,r)=>c<0||c>=MW||r<0||r>=MH?'#':HM[r][c]; // outside = rock
const tAt=(x,y)=>tile(Math.floor(x/TS),Math.floor(y/TS));
const floorAt=(x,z)=>'#='.includes(tAt(x,z));
function movePlat(f,dx){ // horizontal then vertical, against rock; '=' platforms only stop a fall
  const hw=f.hw||6,h=f.h||40;f.wall=false;f.x+=dx;
  for(const yy of[f.z-3,f.z-h/2,f.z-h+2]){
    if(tAt(f.x+hw,yy)==='#'){f.x=Math.floor((f.x+hw)/TS)*TS-hw-.01;f.wall=true}
    if(tAt(f.x-hw,yy)==='#'){f.x=Math.floor((f.x-hw)/TS)*TS+TS+hw+.01;f.wall=true}}
  f.vy=Math.max(f.vy-GRAV,-7);const nz=f.z-f.vy;f.ground=false;
  if(f.vy<=0){const B=Math.floor(nz/TS)*TS;
    if(f.z<=B+.01)for(const xx of[f.x-hw+1,f.x+hw-1]){const c=tAt(xx,B);if(c==='#'||(c==='='&&!(f.drop>0))){f.z=B;f.vy=0;f.ground=true;return}}}
  else{const hy=nz-h;if(tAt(f.x-hw+1,hy)==='#'||tAt(f.x+hw-1,hy)==='#'){f.z=(Math.floor(hy/TS)+1)*TS+h;f.vy=0;return}}
  f.z=nz;
}
function msg(s,n=200){G.msg=s;G.msgT=n}
function spawnPlat(kind,c,r){const k=EK[kind];
  const e={k,kind,x:c*TS+8,z:r*TS,x0:c*TS+8,z0:r*TS,y:0,vy:0,dir:-1,hp:k.hp,maxhp:k.hp,state:'walk',st:0,cd:60,mcd:rand(90,160)|0,walk:0,inv:0,flashT:0,hits:new Set(),s:k.s,ph:rand(0,6),cy:20*k.s,hh:18*k.s};
  if(kind==='bat')Object.assign(e,{fly:1,cy:0,hh:6});
  if(kind==='cerberus')Object.assign(e,{fly:1,cy:30,hh:30,hw:36,h:56,mt:0,mv:null});
  G.enemies.push(e);if(k.boss){G.boss=e;G.bossBanner=120}return e}
function hellInit(){
  HM=buildHell();
  Object.assign(G,{camY:0,obols:0,wings:0,crossed:0,arena:0,ferry:null,boatX:70*TS+22,pk:HELL_ITEMS.map(([k,c,r])=>({t:k,x:c*TS+8,z:r*TS})),

function contact(e,rx,dmg){const p=G.p;if(canHit(p)&&Math.abs(p.x-e.x)<rx&&Math.abs((p.z-p.cy)-(e.z-e.cy))<e.hh+14)damage(p,dmg,Math.sign(p.x-e.x)||1,2.5,false,e)}
function updatePlatPlayer(p){
  const c=G.char;if(p.inv>0)p.inv--;if(p.flashT>0)p.flashT--;if(p.drop>0)p.drop--;
  if(p.state==='dead'){if(++p.st>90){if(--G.lives>0)Object.assign(p,{hp:p.maxhp,state:'idle',st:0,inv:150,x:G.safe.x,z:G.safe.z,vy:0,kx:0});else{state='gameover';G.endT=0}}return}
  if(G.ferry)return;
  p.st++;
  const dx=(held.right?1:0)-(held.left?1:0);let mv=0;
  if(p.state==='idle'||p.state==='walk'||p.state==='jump'){
    if(dx)p.dir=dx;mv=dx*1.5*c.spd;
    if(pressed('jump')){
      if(p.ground&&held.down&&tAt(p.x,p.z)==='='){p.drop=10;p.z+=1} // drop through a platform
      else if(p.ground){Object.assign(p,{vy:5.2,state:'jump',atk:null,ja:0});SFX.jump()}
      else if(G.wings&&!p.dj){p.vy=4.6;p.dj=1;SFX.jump();burst(p.x,p.z,4,10,['#fff','#ffe9a0'],1.5,.05,14)}} // Hermes' wings
    if(p.en>=50&&(pressed('special')||pressed('special2'))){p.en-=50;p.state='cast';p.st=0;SFX[c.sfx]()}
    else if(pressed('attack')){
      if(p.ground&&p.state!=='jump')startAtk(p,0);
      else if((!p.atk||p.at>12)&&(p.ja|0)<3){p.atk={...JATK,reach:JATK.reach+c.reach,dmg:JATK.dmg*pw(p)};p.at=0;p.ja=(p.ja|0)+1;p.hits.clear();SFX.swing()}}
  }
  if(p.state==='atk'){const a=p.atk;mv=0;if(pressed('attack'))p.buf=true;
    if(p.st>=a.su&&p.st<a.su+a.ac){hitScan(p,a);atkFx(p,a)}
    if(p.st>=a.su+a.ac+a.rc){if(p.buf&&p.combo<2)startAtk(p,p.combo+1);else p.state='idle'}}
  else if(p.state==='cast'){mv=0;if(p.st===8){const k=c.mfx==='bash'?'bullet':SHOT[c.mfx]||'blade';pshot(p,k,6,30*pw(p),{pierce:true,r:9,life:90,col:c.col[0]});G.shake=4}if(p.st>=20)p.state='idle'}
  if(p.state==='jump'&&p.atk&&++p.at<10)hitScan(p,p.atk);
  if(p.kx){mv+=p.kx;p.kx*=.8;if(Math.abs(p.kx)<.1)p.kx=0}
  movePlat(p,mv);
  if(p.ground){p.dj=0;if(p.state==='jump'){p.state='idle';p.atk=null;p.ja=0;burst(p.x,p.z,0,4,['#a66'],1,.05,12)}
    if(p.state==='idle'||p.state==='walk'){p.state=dx?'walk':'idle';if(dx)p.walk++}
    if(floorAt(p.x-6,p.z)&&floorAt(p.x+6,p.z))G.safe={x:p.x,z:p.z}} // last safe spot (lava / Styx respawn)
  else if(p.state==='idle'||p.state==='walk')p.state='jump';
  const hz=tAt(p.x,p.z-2);
  if((hz==='L'||hz==='R')&&p.state!=='dead'){p.hp-=hz==='L'?15:10;SFX.fire();burst(p.x,p.z,4,16,hz==='L'?['#ff3','#f90','#f40']:['#4cc','#9ff','#033'],2,.05,18);G.flash=6;styleDrop();
    if(p.hp<=0){p.state='dead';p.st=0;SFX.ko()}else Object.assign(p,{x:G.safe.x,z:G.safe.z,vy:0,kx:0,inv:90,state:'idle'})}
  pickups(p);
}
function updatePlatEnemy(e){
  const p=G.p,k=e.k;if(e.inv>0)e.inv--;if(e.flashT>0)e.flashT--;
  if(e.state==='dead'){e.st++;return}
  if(e.state==='flee'){e.x+=4;if(e.st%6===0)burst(e.x-30,e.z,2,3,['#888','#a33'],1,.05,12);if(++e.st>90){e.state='dead';e.st=51}return} // runs off through the rock
  if(e.kind==='cerberus')return updateCerb(e);
  const dx=p.x-e.x,near=Math.abs(dx)<150&&Math.abs(p.z-e.z)<70;
  if(k.ghost){ // drifts through walls towards the player
    e.st++;if(e.kx){e.x+=e.kx;e.kx*=.85}if(e.hs>0){e.hs--;e.state='hurt';return}e.state='idle';
    if(near){e.x+=clamp(dx,-.55,.55);e.z+=clamp(p.z-4-e.z,-.45,.45);e.dir=dx>0?1:-1}e.z+=Math.sin(e.st*.06)*.3;contact(e,12,k.dmg);return}
  if(e.kind==='bat'){ // hovers, swoops at the player and flies back
    e.st++;if(e.sw>0){e.sw--;const s=e.sw>=40?1:-1;e.x+=e.svx*s;e.z+=e.svz*s}
    else{e.x=e.x0+Math.sin(e.st*.03+e.ph)*30;e.z=e.z0+Math.sin(e.st*.07)*8;
      if(near&&Math.random()<.012){e.sw=80;e.svx=dx/40;e.svz=(p.z-20-e.z)/40;tone('square',1200,700,.1,.03)}}
    if(e.sw===0){e.x0=e.x-Math.sin(e.st*.03+e.ph)*30}
    contact(e,10,k.dmg);return}
  // walkers (skeleton, demon): patrol, turn at ledges, chase and strike when level with the player
  if(e.hs>0){e.hs--;e.state='hurt';let m=0;if(e.kx){m=e.kx;e.kx*=.8}if(m&&!floorAt(e.x+Math.sign(m)*8,e.z+1))m=0;movePlat(e,m);return}
  if(e.state==='windup'){if(++e.st>=18){e.state='strike';e.st=0;e.hits.clear();SFX.swing()}movePlat(e,0);return}
  if(e.state==='strike'){if(e.st<=5&&canHit(p)&&!e.hits.has(p)&&inRange(e,p,k.reach*e.s+6)){e.hits.add(p);damage(p,k.dmg,e.dir,2,false,e)}
    if(++e.st>18){e.state='walk';e.cd=rand(50,90)|0}movePlat(e,0);return}
  e.cd--;let mv;
  const level=near&&Math.abs(p.z-e.z)<20;
  if(level){e.dir=dx>0?1:-1;mv=Math.abs(dx)>k.reach*e.s-4?e.dir*k.spd:0;if(!mv&&e.cd<=0){e.state='windup';e.st=0;return}}
  else mv=e.dir*k.spd*.6;
  if(k.shoot&&near&&--e.mcd<=0){e.mcd=rand(140,220)|0;e.dir=dx>0?1:-1;G.proj.push({owner:'e',kind:'fire',x:e.x+e.dir*14,z:e.z,y:24,vx:e.dir*2.6,dmg:9,r:6,life:150,hits:new Set()});SFX.fire()}
  if(mv){const ax=e.x+Math.sign(mv)*10;if(!floorAt(ax,e.z+1)||tAt(ax,e.z-10)==='#'){if(!level)e.dir=-e.dir;mv=0}}
  movePlat(e,mv);e.state=mv?'walk':'idle';if(mv)e.walk++;
}
// Cerberus: fire breath from three heads, charge across the arena, leap + shockwave
function updateCerb(e){

      if(T===36){const n=enr?5:3;for(let i=0;i<n;i++){const a=Math.atan2((p.z-20)-(e.z-50),p.x-e.x)+(i-(n-1)/2)*.22;

function updateFerry(){const p=G.p;G.boatX=Math.min(G.boatX+1.1,86*TS-10);Object.assign(p,{x:G.boatX+6,z:28*TS-3,vy:0,state:'idle',dir:1});

function aquila(e){ // Zeus' eagle: feather fans, lightning, swooping dives

function render(){

function wrap(s,n){const out=[];let l='';for(const w of s.split(' ')){if(l&&(l+' '+w).length>n){out.push(l);l=w}else l=l?l+' '+w:w}if(l)out.push(l);return out}
function updateStory(){
  const s=G.story,n=storyLine(s).text.length;
  if(s.ch<n&&(s.ch|0)%3===0)tone('square',620,620,.02,.015);
  s.ch+=.8;
  if(pressed('back')||pressed('start'))s.i=s.l.length; // skip the scene
  else if(pressed('attack')||pressed('jump')){if(s.ch<n)s.ch=n;else{s.i++;s.ch=0;SFX.select()}}
  if(s.i>=s.l.length){G.story=null;s.then()}
}
function drawStory(){
  const s=G.story;if(!s)return;const L=storyLine(s),y=146,col=L.col;
  R(0,0,W,H,'rgba(0,0,0,.35)');R(6,y,W-12,72,'rgba(8,6,20,.92)');ctx.strokeStyle=col;ctx.lineWidth=1;ctx.strokeRect(6.5,y+.5,W-13,71);
  const px=L.hero?12:W-70;if(L.id)R(px,y+7,58,58,'#1d1838');
  if(L.id&&sprReady(L.id))ctx.drawImage(SPR[L.id],12,(L.hero?25:23)*64+2,40,40,px+1,y+8,56,56); // head crop of the stand row (hero faces right, foe faces left)
  const tx=L.hero?78:14;txt(L.name,tx,y+6,8,col);
  let k=s.ch|0;for(const [i,l] of wrap(L.text,52).entries()){if(k>0)txt(l.slice(0,k),tx,y+20+i*11,8,'#fff');k-=l.length+1}
  if(s.ch>=L.text.length&&(t>>4)%2)txt('Z >',L.hero?W-14:W-76,y+60,7,'#aaa','right');
}

/* ---------- LOOP ---------- */
const PAUSE_ITEMS=['REPRENDRE','CHANGER DE PERSO','RETOUR AU TITRE'];
function pauseMenu(){
  if(pressed('up')){G.pm=(G.pm+2)%3;SFX.select()}
  if(pressed('down')){G.pm=(G.pm+1)%3;SFX.select()}
  if(pressed('back')){paused=false;return}
  if(!pressed('start')&&!pressed('attack'))return;
  SFX.confirm();
  if(G.pm===0)paused=false;
  else if(G.pm===1){sel=G.ci;G.swap=true;state='select'}
  else{state='title';paused=false;parts.length=bolts.length=arcs.length=0}
}
function step(){
  pollInput();t++;
  let keepTaps=false;
  if(state==='title'){if(pressed('start')||pressed('attack')){state='level';SFX.confirm()}}
  else if(state==='level'){const n=LEVELS.length+1; // last entry = cutscene viewer
    if(pressed('up')){lvSel=(lvSel+n-1)%n;SFX.select()}
    if(pressed('down')){lvSel=(lvSel+1)%n;SFX.select()}
    if(pressed('back')){state='title';SFX.select()}
    else if(pressed('start')||pressed('attack')){state=lvSel<LEVELS.length?'select':'cines';SFX.confirm()}}
  else if(state==='cines'){const n=CINES.length,hs=CHARS.filter(avail),k=hs.indexOf(CHARS[sel]);
    if(pressed('up')){cSel=(cSel+n-1)%n;SFX.select()}
    if(pressed('down')){cSel=(cSel+1)%n;SFX.select()}
    if(pressed('left')||pressed('right')){sel=CHARS.indexOf(hs[(k+(pressed('left')?hs.length-1:1))%hs.length]);SFX.select()}
    if(pressed('back')){state='level';SFX.select()}
    else if(pressed('start')||pressed('attack')){SFX.confirm();playCine()}}
  else if(state==='select'){
    const n=CHARS.length;
    if(pressed('left')){sel=(sel+n-1)%n;SFX.select()}
    if(pressed('right')){sel=(sel+1)%n;SFX.select()}
    const c=CHARS[sel],ok=avail(c),px=W/2,py=88;
    if(ok&&t%80===2){if(c.mfx==='bolt')bolts.push({x:px,z:py+10,life:8,col:'#9df'});if(c.mfx==='slash')arcs.push({x:px,z:py,y:0,r:30,life:10,max:10,col:c.col[0],full:true,w:2})}
    if(ok&&c.mfx!=='bolt'&&c.mfx!=='slash'&&t%80<14)burst(px+26,py-6,0,3,c.col,1,-.05,16);
    updateFx();
    const swap=G&&G.swap;
    if(pressed('back')){if(!(G&&G.pick)){SFX.select();if(swap){G.swap=false;state='play'}else state='level'}} // no way back from the storm
    else if(pressed('start')||pressed('attack')){
      if(!ok)SFX.hurt();
      else{SFX.confirm();
        if(G&&G.pick){G.pick=0;G.ci=sel;G.char=c;G.p=null;startLevel(LEVELS.findIndex(L=>L.plat));story('hell',()=>{state='play'})}
        else if(swap){G.swap=false;G.ci=sel;G.char=c;Object.assign(G.p,{charged:0,form:0,trail:[],held:null,state:'idle',atk:null,st:0});state='play';paused=false;parts.length=bolts.length=arcs.length=0}
        else newGame(sel)}}
  }
  else if(state==='story')updateStory();
  else if(state==='play'){
    if(G.hitstop>0){G.hitstop--;keepTaps=true} // keep presses made during hit-freeze
    else if(paused)pauseMenu();
    else if(!G.cine&&(pressed('start')||pressed('back'))){paused=true;G.pm=0;SFX.select()}
    else updateGame();
  }
  else{G.endT++;if(G.endT>60&&(pressed('start')||pressed('attack'))){state='title';parts.length=bolts.length=arcs.length=0}}
  if(!keepTaps)tapped.clear();
}
let last=performance.now(),acc=0;
function frame(now){acc+=Math.min(100,now-last);last=now;while(acc>=1000/60){step();acc-=1000/60}render();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
